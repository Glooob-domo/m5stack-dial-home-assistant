globals:
  - id: menu_sel
    type: int
    initial_value: '0'
  - id: menu_func
    type: int
    initial_value: '8'
  - id: in_menu
    type: bool
    initial_value: 'false'
  - id: menu_animating
    type: bool
    initial_value: 'false'
  - id: button_debounce
    type: bool
    initial_value: 'false'
  - id: button_press_count
    type: int
    initial_value: '0'
  - id: button_last_press_ms
    type: uint32_t
    initial_value: '0'

dial_carousel:
  - id: menu_carousel
    slots:
      - container: slot_far_up
        icon: slot_far_up_img
        title: slot_far_up_lbl
      - container: slot_near_up
        icon: slot_near_up_img
        title: slot_near_up_lbl
      - container: slot_center
        icon: slot_center_img
        title: slot_center_lbl
      - container: slot_near_dn
        icon: slot_near_dn_img
        title: slot_near_dn_lbl
      - container: slot_far_dn
        icon: slot_far_dn_img
        title: slot_far_dn_lbl
    center_bar: slot_center_bar
    center_sub: slot_center_sub

script:
  - id: menu_sync_selection
    then:
      - lambda: |-
          DialMenuCounts counts;
          counts.lights = id(dial_lights_id).light_count();
          counts.covers = id(dial_covers_id).count();
          counts.garages = id(dial_garages_id).count();
          counts.switches = id(dial_switches_id).count();
          counts.scenes = id(dial_scenes_id).count();
          counts.climates = id(dial_climates_id).count();
          counts.media = id(dial_media_players_id).count();
          counts.temperatures = id(dial_temperatures_id).count();
          int items[DIAL_MENU_MAX];
          const int n = dial_collect_menu_items(
              items, "${timer_entity}", counts);

          const int home_idx = n - 1;
          bool found = false;
          for (int i = 0; i < n; i++) {
            if (items[i] == id(menu_func)) {
              id(menu_sel) = i;
              found = true;
              break;
            }
          }
          if (!found) {
            id(menu_func) = DIAL_FUNC_HOME;
            id(menu_sel) = home_idx;
          }

  - id: open_menu
    then:
      - script.execute: menu_sync_selection
      - globals.set: {id: in_menu, value: 'true'}
      - script.execute: refresh_menu
      - lvgl.page.show:
          id: page_menu
          animation: MOVE_RIGHT

  - id: open_menu_back
    then:
      - script.execute: menu_sync_selection
      - globals.set: {id: in_menu, value: 'true'}
      - script.execute: refresh_menu
      - lvgl.page.show:
          id: page_menu
          animation: MOVE_RIGHT

  - id: close_menu
    then:
      - globals.set: {id: in_menu, value: 'false'}
      - lvgl.page.show:
          id: page_clock
          animation: MOVE_LEFT

  - id: menu_scroll_up
    then:
      - if:
          condition:
            lambda: 'return !id(menu_animating);'
          then:
            - globals.set: {id: menu_animating, value: 'true'}
            - lambda: |-
                lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);

                auto on_ready = +[](void *ctx) {
                  DialMenuCounts counts;
                  counts.lights = id(dial_lights_id).light_count();
                  counts.covers = id(dial_covers_id).count();
                  counts.garages = id(dial_garages_id).count();
                  counts.switches = id(dial_switches_id).count();
                  counts.scenes = id(dial_scenes_id).count();
                  counts.climates = id(dial_climates_id).count();
                  counts.media = id(dial_media_players_id).count();
                  counts.temperatures = id(dial_temperatures_id).count();
                  int local_items[DIAL_MENU_MAX];
                  const int local_n = dial_collect_menu_items(
                      local_items, "${timer_entity}", counts);

                  id(menu_sel) = ((id(menu_sel) - 1) % local_n + local_n) % local_n;
                  id(menu_func) = local_items[id(menu_sel)];
                  id(refresh_menu).execute();
                  id(menu_animating) = false;
                };
                if (!id(menu_carousel).start_animation(
                        esphome::dial_carousel::CarouselDirection::UP, 54, on_ready, nullptr)) {
                  id(menu_animating) = false;
                }

  - id: menu_scroll_down
    then:
      - if:
          condition:
            lambda: 'return !id(menu_animating);'
          then:
            - globals.set: {id: menu_animating, value: 'true'}
            - lambda: |-
                lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);

                auto on_ready = +[](void *ctx) {
                  DialMenuCounts counts;
                  counts.lights = id(dial_lights_id).light_count();
                  counts.covers = id(dial_covers_id).count();
                  counts.garages = id(dial_garages_id).count();
                  counts.switches = id(dial_switches_id).count();
                  counts.scenes = id(dial_scenes_id).count();
                  counts.climates = id(dial_climates_id).count();
                  counts.media = id(dial_media_players_id).count();
                  counts.temperatures = id(dial_temperatures_id).count();
                  int local_items[DIAL_MENU_MAX];
                  const int local_n = dial_collect_menu_items(
                      local_items, "${timer_entity}", counts);

                  id(menu_sel) = (id(menu_sel) + 1) % local_n;
                  id(menu_func) = local_items[id(menu_sel)];
                  id(refresh_menu).execute();
                  id(menu_animating) = false;
                };
                if (!id(menu_carousel).start_animation(
                        esphome::dial_carousel::CarouselDirection::DOWN, 64, on_ready, nullptr)) {
                  id(menu_animating) = false;
                }

  - id: menu_confirm
    then:
      - lambda: |-
          ESP_LOGI("menu", "selected func %d visual %d", id(menu_func), id(menu_sel));
          switch (id(menu_func)) {
            case 0:
              id(open_timer).execute();
              break;
            case 1:
              if (id(dial_lights_id).light_count() == 1) {
                id(dial_lights_id).select_light(0);
                id(open_selected_light).execute();
              } else if (id(dial_lights_id).light_count() > 1) {
                id(open_light_selector).execute();
              } else {
                ESP_LOGW("menu", "Lights selected but dial_lights is empty");
              }
              break;
            case 2:
              id(cover_page_kind) = 0;
              if (id(dial_covers_id).count() == 1) {
                id(dial_covers_id).select(0);
                id(open_cover).execute();
              } else if (id(dial_covers_id).count() > 1) {
                id(entity_selector_kind) = 2;
                id(open_entity_selector).execute();
              }
              break;
            case 3:
              if (id(dial_garages_id).count() == 1) {
                id(dial_garages_id).select(0);
                id(open_garage).execute();
              } else if (id(dial_garages_id).count() > 1) {
                id(entity_selector_kind) = 3;
                id(open_entity_selector).execute();
              }
              break;
            case 4:
              if (id(dial_switches_id).count() == 1) {
                id(dial_switches_id).select(0);
                id(open_switch).execute();
              } else if (id(dial_switches_id).count() > 1) {
                id(entity_selector_kind) = 4;
                id(open_entity_selector).execute();
              }
              break;
            case 5:
              if (id(dial_scenes_id).count() == 1) {
                id(dial_scenes_id).select(0);
                id(open_scene).execute();
              } else if (id(dial_scenes_id).count() > 1) {
                id(entity_selector_kind) = 5;
                id(open_entity_selector).execute();
              }
              break;
            case 6:
              if (id(dial_climates_id).count() == 1) {
                id(dial_climates_id).select(0);
                id(open_air).execute();
              } else if (id(dial_climates_id).count() > 1) {
                id(entity_selector_kind) = 0;
                id(open_entity_selector).execute();
              } else {
                id(open_air).execute();
              }
              break;
            case 7:
              if (id(dial_media_players_id).count() == 1) {
                id(dial_media_players_id).select(0);
                id(open_music).execute();
              } else if (id(dial_media_players_id).count() > 1) {
                id(entity_selector_kind) = 1;
                id(open_entity_selector).execute();
              } else {
                id(open_music).execute();
              }
              break;
            case 9:
              if (id(dial_temperatures_id).count() == 0) {
                ESP_LOGW("menu", "Rooms selected but dial_temperatures is empty");
              } else {
                id(open_temp).execute();
              }
              break;
            case 8:
            default:
              id(close_menu).execute();
              break;
          }

  - id: menu_on_ha_update
    then:
      - if:
          condition:
            lambda: 'return id(in_menu);'
          then:
            - script.execute: refresh_menu_subtitle

  - id: refresh_menu_subtitle
    then:
      - lambda: |-
          static char subbuf[64];
          const uint32_t ACCENT_COLORS[10] = {
            0xFB923C, 0xFDC003, 0x2DD4BF, 0xF97316, 0x4ADE80, 0xF472B6, 0x5ABBFD, 0xA792E8, 0x576BFE, 0xF59E0B
          };

          auto format_time_short = [](int seconds, char *buf, size_t len) {
            if (seconds < 0) seconds = 0;
            const int h = seconds / 3600;
            const int m = (seconds % 3600) / 60;
            const int s = seconds % 60;
            if (h > 0)
              snprintf(buf, len, "%d:%02d:%02d", h, m, s);
            else
              snprintf(buf, len, "%d:%02d", m, s);
          };

          auto is_invalid_state = [](const std::string &value) -> bool {
            if (value.empty()) return true;
            std::string lower = value;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };

          const int func = id(menu_func);
          switch (func) {
            case 0: {
              const int IDLE = 0;
              const int ACTIVE = 1;
              const int PAUSED = 2;
              const int FINISHED = 3;
              const int UNAVAILABLE = 4;
              const int state = id(timer_ui_state);
              if (state == UNAVAILABLE || !id(ha_connected)) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              } else if (state == IDLE) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::no_timer());
              } else if (state == FINISHED) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::finished());
              } else {
                char timebuf[16];
                format_time_short(id(timer_remaining_seconds), timebuf, sizeof(timebuf));
                if (state == ACTIVE)
                  snprintf(subbuf, sizeof(subbuf), dial_i18n::timer_left(), timebuf);
                else
                  snprintf(subbuf, sizeof(subbuf), dial_i18n::timer_paused(), timebuf);
              }
              break;
            }
            case 1: {
              const size_t count = id(dial_lights_id).light_count();
              if (count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                break;
              }
              if (count == 1) {
                const auto snap = id(dial_lights_id).card_snapshot_at(0);
                if (!snap.state_valid) {
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                } else if (!snap.is_on) {
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::light_off());
                } else if (snap.brightness_valid) {
                  snprintf(subbuf, sizeof(subbuf), dial_i18n::light_on_pct(), snap.brightness_percent);
                } else {
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::light_on());
                }
                break;
              }
              size_t on_count = 0;
              bool any_valid = false;
              for (size_t i = 0; i < count; i++) {
                const auto snap = id(dial_lights_id).card_snapshot_at(i);
                if (snap.state_valid) {
                  any_valid = true;
                  if (snap.is_on) on_count++;
                }
              }
              if (!any_valid) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              } else if (on_count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::lights_all_off());
              } else if (on_count == count) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::lights_all_on());
              } else {
                snprintf(subbuf, sizeof(subbuf), dial_i18n::lights_n_on(), (int) on_count, (int) count);
              }
              break;
            }
            case 2: {
              const size_t count = id(dial_covers_id).count();
              if (count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                break;
              }
              if (count == 1) {
                const int pos = id(dial_covers_id).position_at(0);
                dial_i18n::cover_status_from(id(dial_covers_id).state_at(0), id(dial_covers_id).state_valid_at(0), pos,
                                             pos >= 0, subbuf, sizeof(subbuf));
                break;
              }
              size_t open_count = 0;
              bool any_valid = false;
              for (size_t i = 0; i < count; i++) {
                if (id(dial_covers_id).cover_known_at(i)) {
                  any_valid = true;
                  if (id(dial_covers_id).cover_is_open_at(i))
                    open_count++;
                }
              }
              if (!any_valid) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              else if (open_count == 0) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::covers_all_closed());
              else if (open_count == count) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::covers_all_open());
              else snprintf(subbuf, sizeof(subbuf), dial_i18n::covers_n_open(), (int) open_count, (int) count);
              break;
            }
            case 3: {
              const size_t count = id(dial_garages_id).count();
              if (count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                break;
              }
              if (count == 1) {
                const int pos = id(dial_garages_id).position_at(0);
                dial_i18n::cover_status_from(id(dial_garages_id).state_at(0), id(dial_garages_id).state_valid_at(0), pos,
                                             pos >= 0, subbuf, sizeof(subbuf));
                break;
              }
              size_t open_count = 0;
              bool any_valid = false;
              for (size_t i = 0; i < count; i++) {
                if (id(dial_garages_id).cover_known_at(i)) {
                  any_valid = true;
                  if (id(dial_garages_id).cover_is_open_at(i))
                    open_count++;
                }
              }
              if (!any_valid) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              else if (open_count == 0) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::covers_all_closed());
              else if (open_count == count) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::covers_all_open());
              else snprintf(subbuf, sizeof(subbuf), dial_i18n::covers_n_open(), (int) open_count, (int) count);
              break;
            }
            case 4: {
              const size_t count = id(dial_switches_id).count();
              if (count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                break;
              }
              if (count == 1) {
                if (!id(dial_switches_id).state_valid_at(0))
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                else if (id(dial_switches_id).state_at(0) == "on")
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::switch_on());
                else
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::switch_off());
                break;
              }
              size_t on_count = 0;
              bool any_valid = false;
              for (size_t i = 0; i < count; i++) {
                if (id(dial_switches_id).state_valid_at(i)) {
                  any_valid = true;
                  if (id(dial_switches_id).state_at(i) == "on") on_count++;
                }
              }
              if (!any_valid) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              else if (on_count == 0) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::switches_all_off());
              else if (on_count == count) snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::switches_all_on());
              else snprintf(subbuf, sizeof(subbuf), dial_i18n::switches_n_on(), (int) on_count, (int) count);
              break;
            }
            case 5: {
              const size_t count = id(dial_scenes_id).count();
              if (count == 0)
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              else if (count == 1)
                snprintf(subbuf, sizeof(subbuf), "%s", id(dial_scenes_id).name_at(0).c_str());
              else
                snprintf(subbuf, sizeof(subbuf), dial_i18n::scenes_n(), (int) count);
              break;
            }
            case 6: {
              auto format_setpoint = [](float t, char *buf, size_t len) -> bool {
                if (isnan(t)) return false;
                const float rounded = roundf(t);
                if (fabsf(t - rounded) > 0.05f)
                  snprintf(buf, len, "%.1f °C", t);
                else
                  snprintf(buf, len, "%.0f °C", t);
                return true;
              };

              auto hvac_label = [](const std::string &mode, char *buf, size_t len) -> bool {
                return dial_i18n::hvac_menu(mode, buf, len);
              };

              if (id(dial_climates_id).count() > 1) {
                snprintf(subbuf, sizeof(subbuf), dial_i18n::climates_n(), (int) id(dial_climates_id).count());
                break;
              }

              char statebuf[24] = "";
              bool has_state = false;
              std::string mode;
              if (id(dial_climates_id).count() == 1 && id(dial_climates_id).state_valid_at(0)) {
                mode = id(dial_climates_id).state_at(0);
              }
              if (!mode.empty())
                has_state = hvac_label(mode, statebuf, sizeof(statebuf));

              float setpoint = NAN;
              if (id(dial_climates_id).count() == 1 && id(dial_climates_id).attr_valid_at(0, "temperature")) {
                setpoint = atof(id(dial_climates_id).attr_at(0, "temperature").c_str());
              }
              if (isnan(setpoint) && id(dial_climates_id).count() == 1 &&
                  id(dial_climates_id).attr_valid_at(0, "current_temperature")) {
                setpoint = atof(id(dial_climates_id).attr_at(0, "current_temperature").c_str());
              }

              char tempbuf[16] = "";
              const bool has_temp = format_setpoint(setpoint, tempbuf, sizeof(tempbuf));

              if (has_state && has_temp)
                snprintf(subbuf, sizeof(subbuf), "%s · %s", statebuf, tempbuf);
              else if (has_state)
                snprintf(subbuf, sizeof(subbuf), "%s", statebuf);
              else if (has_temp)
                snprintf(subbuf, sizeof(subbuf), "%s", tempbuf);
              else
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              break;
            }
            case 7: {
              if (id(dial_media_players_id).count() > 1) {
                snprintf(subbuf, sizeof(subbuf), dial_i18n::players_n(), (int) id(dial_media_players_id).count());
                break;
              }
              std::string status;
              if (id(dial_media_players_id).count() == 1 && id(dial_media_players_id).state_valid_at(0)) {
                status = id(dial_media_players_id).state_at(0);
              }
              if (status.empty()) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
                break;
              }
              if (status == "off") {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::media_off());
              } else if (status == "idle") {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::media_idle());
              } else if (status == "paused") {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::media_paused());
              } else if (status == "playing" || status == "buffering") {
                std::string title;
                if (id(dial_media_players_id).count() == 1 && id(dial_media_players_id).attr_valid_at(0, "title"))
                  title = id(dial_media_players_id).attr_at(0, "title");
                if (title.empty()) title = id(track_title).state;
                if (!title.empty()) {
                  // Cap at 20 chars (UTF-8 safe) so a long title can't
                  // wrap the subtitle across multiple lines.
                  if (title.size() > 20) {
                    size_t cut = 20;
                    while (cut > 0 && (title[cut] & 0xC0) == 0x80) cut--;
                    title = title.substr(0, cut) + "...";
                  }
                  snprintf(subbuf, sizeof(subbuf), "%s", title.c_str());
                } else {
                  snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::media_playing());
                }
              } else {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              }
              break;
            }
            case 9: {
              const size_t count = id(dial_temperatures_id).count();
              if (count == 0) {
                snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::unavailable());
              } else if (count == 1) {
                dial_i18n::format_room_temp(id(dial_temperatures_id).state_at(0),
                                            id(dial_temperatures_id).state_valid_at(0),
                                            id(dial_temperatures_id).attr_at(0, "current_temperature"),
                                            id(dial_temperatures_id).attr_valid_at(0, "current_temperature"),
                                            subbuf, sizeof(subbuf));
              } else {
                snprintf(subbuf, sizeof(subbuf), dial_i18n::temps_n(), (int) count);
              }
              break;
            }
            case 8:
            default:
              snprintf(subbuf, sizeof(subbuf), "%s", dial_i18n::menu_clock());
              break;
          }

          lv_label_set_text(id(slot_center_sub), subbuf);
          lv_obj_set_style_opa(id(slot_center_sub), 255, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(slot_center_sub), lv_color_hex(ACCENT_COLORS[func]), LV_PART_MAIN);

  - id: menu_touch_slot
    parameters:
      slot_offset: int
    then:
      - lambda: |-
          static constexpr int OFFSETS[5] = {-2, -1, 0, 1, 2};

          DialMenuCounts counts;
          counts.lights = id(dial_lights_id).light_count();
          counts.covers = id(dial_covers_id).count();
          counts.garages = id(dial_garages_id).count();
          counts.switches = id(dial_switches_id).count();
          counts.scenes = id(dial_scenes_id).count();
          counts.climates = id(dial_climates_id).count();
          counts.media = id(dial_media_players_id).count();
          counts.temperatures = id(dial_temperatures_id).count();
          int items[DIAL_MENU_MAX];
          const int n = dial_collect_menu_items(
              items, "${timer_entity}", counts);

          int slot = -1;
          for (int s = 0; s < 5; s++) {
            if (OFFSETS[s] == slot_offset) {
              slot = s;
              break;
            }
          }
          if (slot < 0)
            return;

          const int sel = id(menu_sel);
          const int idx = ((sel + slot_offset) % n + n) % n;

          int best_slot_for_index[DIAL_MENU_MAX];
          for (int i = 0; i < n; i++)
            best_slot_for_index[i] = -1;
          for (int s = 0; s < 5; s++) {
            const int off = OFFSETS[s];
            const int item_idx = ((sel + off) % n + n) % n;
            const int dist = off >= 0 ? off : -off;
            if (best_slot_for_index[item_idx] == -1) {
              best_slot_for_index[item_idx] = s;
            } else {
              const int existing_off = OFFSETS[best_slot_for_index[item_idx]];
              const int existing_dist = existing_off >= 0 ? existing_off : -existing_off;
              if (dist < existing_dist || (dist == existing_dist && off == 0))
                best_slot_for_index[item_idx] = s;
            }
          }
          if (best_slot_for_index[idx] != slot)
            return;

          id(menu_sel) = idx;
          id(menu_func) = items[idx];
          id(menu_confirm).execute();

  - id: refresh_menu
    then:
      - lambda: |-
          static constexpr int SLOT_N = 5;
          static constexpr int OFFSETS[5] = {-2, -1, 0, 1, 2};

          DialMenuCounts counts;
          counts.lights = id(dial_lights_id).light_count();
          counts.covers = id(dial_covers_id).count();
          counts.garages = id(dial_garages_id).count();
          counts.switches = id(dial_switches_id).count();
          counts.scenes = id(dial_scenes_id).count();
          counts.climates = id(dial_climates_id).count();
          counts.media = id(dial_media_players_id).count();
          counts.temperatures = id(dial_temperatures_id).count();
          int items[DIAL_MENU_MAX];
          const int n = dial_collect_menu_items(
              items, "${timer_entity}", counts);

          lv_obj_t* icons[5] = {
            id(slot_far_up_img),  id(slot_near_up_img),
            id(slot_center_img),
            id(slot_near_dn_img), id(slot_far_dn_img)
          };
          lv_obj_t* title_lbls[5] = {
            id(slot_far_up_lbl),  id(slot_near_up_lbl),
            id(slot_center_lbl),
            id(slot_near_dn_lbl), id(slot_far_dn_lbl)
          };
          lv_obj_t* slots[5] = {
            id(slot_far_up), id(slot_near_up), id(slot_center),
            id(slot_near_dn), id(slot_far_dn)
          };

          const char* TITLES[10] = {
            dial_i18n::menu_timer(), dial_i18n::menu_lights(), dial_i18n::menu_covers(),
            dial_i18n::menu_garage(), dial_i18n::menu_switches(), dial_i18n::menu_scenes(),
            dial_i18n::menu_ac(), dial_i18n::menu_music(), dial_i18n::menu_home(),
            dial_i18n::menu_temps()
          };
          const lv_img_dsc_t* IMGS[10] = {
            id(menu_img_timer)->get_lv_image_dsc(),
            id(menu_img_light)->get_lv_image_dsc(),
            id(menu_img_cover)->get_lv_image_dsc(),
            id(menu_img_garage)->get_lv_image_dsc(),
            id(menu_img_switch)->get_lv_image_dsc(),
            id(menu_img_scene)->get_lv_image_dsc(),
            id(menu_img_ac)->get_lv_image_dsc(),
            id(menu_img_music)->get_lv_image_dsc(),
            id(menu_img_home)->get_lv_image_dsc(),
            id(menu_img_temp)->get_lv_image_dsc()
          };
          const uint32_t ACCENT_COLORS[10] = {
            0xFB923C, 0xFDC003, 0x2DD4BF, 0xF97316, 0x4ADE80, 0xF472B6, 0x5ABBFD, 0xA792E8, 0x576BFE, 0xF59E0B
          };
          const uint32_t PILL_COLORS[10] = {
            0x2A1200, 0x2A1E00, 0x04201A, 0x2A1200, 0x052010, 0x2A0A18, 0x001A2A, 0x150A2A, 0x0D1537, 0x2A1A00
          };

          const int sel = id(menu_sel);
          id(menu_func) = items[sel];

          int best_slot_for_index[DIAL_MENU_MAX];
          for (int i = 0; i < n; i++)
            best_slot_for_index[i] = -1;
          for (int s = 0; s < SLOT_N; s++) {
            const int off = OFFSETS[s];
            const int idx = ((sel + off) % n + n) % n;
            const int dist = off >= 0 ? off : -off;
            if (best_slot_for_index[idx] == -1) {
              best_slot_for_index[idx] = s;
            } else {
              const int existing_off = OFFSETS[best_slot_for_index[idx]];
              const int existing_dist = existing_off >= 0 ? existing_off : -existing_off;
              if (dist < existing_dist || (dist == existing_dist && off == 0))
                best_slot_for_index[idx] = s;
            }
          }

          for (int slot = 0; slot < SLOT_N; slot++) {
            const int off = OFFSETS[slot];
            const int idx = ((sel + off) % n + n) % n;
            const int func = items[idx];
            const bool show = (best_slot_for_index[idx] == slot);

            if (!show) {
              lv_obj_add_flag(slots[slot], LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(slots[slot], LV_OBJ_FLAG_CLICKABLE);
              continue;
            }

            lv_obj_clear_flag(slots[slot], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(slots[slot], LV_OBJ_FLAG_CLICKABLE);

            const auto layout = id(menu_carousel).compute_static_layout(slot, 54);
            id(menu_carousel).apply_container_geometry(slot, layout);

            if (slot == 2) {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(PILL_COLORS[func]), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], 128, LV_PART_MAIN);
              lv_obj_set_style_border_color(slots[slot], lv_color_hex(ACCENT_COLORS[func]), LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 2, LV_PART_MAIN);
              lv_obj_set_style_border_opa(slots[slot], 255, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(slots[slot], lv_color_hex(0x0D1537), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(slots[slot], layout.opa_bg, LV_PART_MAIN);
              lv_obj_set_style_border_width(slots[slot], 0, LV_PART_MAIN);
            }

            if (slot == 2) {
              const int bx = layout.x - 10;
              const int by = layout.y + 12;
              lv_obj_set_pos(id(slot_center_bar), bx, by);
              lv_obj_set_style_bg_color(id(slot_center_bar), lv_color_hex(ACCENT_COLORS[func]), LV_PART_MAIN);
              lv_obj_set_style_opa(id(slot_center_bar), 0, LV_PART_MAIN);
            }

            lv_label_set_text(title_lbls[slot], TITLES[func]);
            if (slot == 2) {
              lv_obj_set_style_text_color(title_lbls[slot], lv_color_hex(ACCENT_COLORS[func]), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(title_lbls[slot], lv_color_hex(0x232A38), LV_PART_MAIN);
            }
            lv_obj_set_style_opa(title_lbls[slot], slot == 2 ? 255 : layout.opa_text, LV_PART_MAIN);
            lv_img_set_src(icons[slot], IMGS[func]);
            lv_obj_set_style_opa(icons[slot], slot == 2 ? 255 : layout.opa_icon, LV_PART_MAIN);
          }

          id(refresh_menu_subtitle).execute();

          {
            const int func = items[sel];
            lv_obj_set_style_bg_color(id(slot_center_bar), lv_color_hex(ACCENT_COLORS[func]), LV_PART_MAIN);
            lv_obj_set_style_border_width(id(slot_center), 0, LV_PART_MAIN);
          }

          lv_obj_t* sdots[5] = {
            id(sdot_0), id(sdot_1), id(sdot_2), id(sdot_3), id(sdot_4)
          };
          const uint32_t sel_accent = ACCENT_COLORS[items[sel]];
          if (n <= 5) {
            for (int d = 0; d < SLOT_N; d++) {
              if (d >= n) {
                lv_obj_add_flag(sdots[d], LV_OBJ_FLAG_HIDDEN);
                continue;
              }
              lv_obj_clear_flag(sdots[d], LV_OBJ_FLAG_HIDDEN);
              const int func = items[d];
              const bool selected = (d == sel);
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(selected ? ACCENT_COLORS[func] : 0x2A3348), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], selected ? 255 : 180, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], selected ? 8 : 4, selected ? 8 : 4);
              lv_obj_set_style_radius(sdots[d], selected ? 0 : 2, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], selected ? 450 : 0, LV_PART_MAIN);
            }
          } else {
            const int sel_dot = (n > 1) ? (sel * 4 / (n - 1)) : 0;
            for (int d = 0; d < SLOT_N; d++) {
              lv_obj_clear_flag(sdots[d], LV_OBJ_FLAG_HIDDEN);
              const bool selected = (d == sel_dot);
              lv_obj_set_style_bg_color(sdots[d], lv_color_hex(selected ? sel_accent : 0x2A3348), LV_PART_MAIN);
              lv_obj_set_style_opa(sdots[d], selected ? 255 : 180, LV_PART_MAIN);
              lv_obj_set_size(sdots[d], selected ? 8 : 4, selected ? 8 : 4);
              lv_obj_set_style_radius(sdots[d], selected ? 0 : 2, LV_PART_MAIN);
              lv_obj_set_style_transform_angle(sdots[d], selected ? 450 : 0, LV_PART_MAIN);
            }
          }

          lv_obj_add_flag(id(menu_arrow), LV_OBJ_FLAG_HIDDEN);

esphome:
  on_loop:
    - lambda: |-
        static uint32_t last_tick_menu_ms = 0;
        uint32_t now_ms = millis();
        if (now_ms - last_tick_menu_ms >= 1000) {
          last_tick_menu_ms = now_ms;
          if (id(in_menu)) {
            id(refresh_menu_subtitle).execute();
          }
        }

