              return buf;

binary_sensor:
  - platform: template
    id: lvgl_encoder_enter
    name: LVGL encoder enter
    internal: true
    disabled_by_default: true
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    # No delayed_on_off: a light tap can be shorter than 30–50ms and would
    # never publish. Coalesce bounce in on_press instead.
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t last = id(button_last_press_ms);
          const uint32_t dt = (last == 0 || now < last) ? 0 : (now - last);
          id(button_last_press_ms) = now;
          ESP_LOGI("button", "edge dt=%u", (unsigned) dt);
          if (last != 0 && dt < 80) {
            ESP_LOGI("button", "bounce ignored");
            return;
          }
          id(button_press_count) += 1;
          ESP_LOGI("button", "press n=%d", id(button_press_count));
          id(dial_button_decide).execute();
    on_release:
      - lambda: 'ESP_LOGI("button", "release");'
  # M5Dial V1.1 uses GPIO46 as HOLD for battery power retention.
  # Keep this old back-button mapping commented; enabling it will conflict with
  # src/main/hardware.yaml:power_hold and battery-only boot will turn off again.
  # - platform: gpio
  #   name: Hold Button
