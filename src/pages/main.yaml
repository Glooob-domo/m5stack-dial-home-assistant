color:
  - id: col_ring_track
    hex: "182033"    # restrained dark ring track
  - id: col_ring_progress
    hex: "5ECAD3"    # muted cyan progress
  - id: col_dot
    hex: "7FB8C2"    # soft minute dot
  - id: col_text_lbl
    hex: "8EA0B8"    # secondary labels
  - id: col_text_temp
    hex: "E8A35B"    # warm temperature accent
  - id: col_text_hum
    hex: "73B7D8"    # calm humidity accent
  - id: col_text_aqi
    hex: "7CCB9A"    # softened AQI accent
  - id: col_text_pres
    hex: "B7A7D9"    # muted pressure accent
  - id: col_text_wind
    hex: "D8C16A"    # restrained wind accent
  - id: col_divider
    hex: "202A3C"

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    timezone: ${timezone}
    update_interval: never
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                static char buf[6];
                auto t = id(rtctime).now();
                sprintf(buf, "%02d:%02d", t.hour, t.minute);
                return buf;
          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                static char buf[20];
                auto t = id(rtctime).now();
                const char* day = dial_i18n::weekday(t.day_of_week);
                sprintf(buf, "%s  %02d/%02d", day, t.month, t.day_of_month);
                return buf;
          - lvgl.arc.update:
              id: arc_minute
              value: !lambda "return id(rtctime).now().minute;"

  - platform: homeassistant
    id: esptime
    timezone: ${timezone}
    on_time_sync:
      then:
        - pcf8563.write_time:
        - script.execute: timer_schedule_sync

script:
  - id: refresh_aqi
    then:
      - lambda: |-
          const float primary = id(ha_aqi).state;
          const float legacy = id(ha_weather_aqi).state;
          const float aqi = std::isfinite(primary) ? primary : legacy;

          static auto aqi_color = [](float v) -> lv_color_t {
            if (v <= 50.0f) return lv_color_hex(0x7CCB9A);
            if (v <= 100.0f) return lv_color_hex(0xD8C16A);
            if (v <= 150.0f) return lv_color_hex(0xE8A35B);
            if (v <= 200.0f) return lv_color_hex(0xF87171);
            if (v <= 300.0f) return lv_color_hex(0xB7A7D9);
            return lv_color_hex(0x991B1B);
          };

          static char buf[8];
          lv_color_t col;
          if (!std::isfinite(aqi)) {
            snprintf(buf, sizeof(buf), "--");
            col = lv_color_hex(0x8EA0B8);
          } else {
            snprintf(buf, sizeof(buf), "%.0f", aqi);
            col = aqi_color(aqi);
          }

          lv_label_set_text(id(lbl_uv), buf);
          lv_obj_set_style_text_color(id(lbl_aqi), col, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_uv), col, LV_PART_MAIN);

  - id: dial_enter_selected
    then:
      - if:
          condition:
            lambda: 'return id(in_menu);'
          then:
            - script.execute: menu_confirm
          else:
            - if:
                condition:
                  lambda: 'return id(in_light_selector);'
                then:
                  - script.execute: light_selector_confirm
                else:
                  - if:
                      condition:
                        lambda: 'return id(in_entity_selector);'
                      then:
                        - script.execute: entity_selector_confirm

  - id: dial_gesture_left
    then:
      - script.execute:
          id: dial_register_activity
          source: "touch"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(in_menu) && !id(in_light_selector) && !id(in_entity_selector) && !id(in_light)
                        && !id(in_air) && !id(in_music) && !id(in_timer) && !id(in_cover)
                        && !id(in_switch) && !id(in_scene)
                        && !id(in_colorpicker);
                then:
                  - script.execute: open_menu
                else:
                  - if:
                      condition:
                        lambda: 'return id(in_menu);'
                      then:
                        - script.execute: dial_enter_selected
                      else:
                        - if:
                            condition:
                              lambda: 'return id(in_light_selector);'
                            then:
                              - script.execute: light_selector_confirm
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(in_entity_selector);'
                                  then:
                                    - script.execute: entity_selector_confirm

  - id: dial_gesture_right
    then:
      - script.execute:
          id: dial_register_activity
          source: "touch"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - script.execute: dial_back

  - id: dial_simple_click
    then:
      - script.execute:
          id: dial_register_activity
          source: "button"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(in_menu) && !id(in_light_selector) && !id(in_entity_selector) && !id(in_light)
                        && !id(in_air) && !id(in_music) && !id(in_timer) && !id(in_cover)
                        && !id(in_switch) && !id(in_scene)
                        && !id(in_colorpicker);
                then:
                  - script.execute: open_menu
                else:
                  - if:
                      condition:
                        lambda: 'return id(in_timer);'
                      then:
                        - script.execute: timer_toggle
                      else:
                        - if:
                            condition:
                              lambda: 'return id(in_air) && id(air_control_mode) != 0;'
                            then:
                              - script.execute: air_confirm_edit
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(in_colorpicker);'
                                  then:
                                    - script.execute: toggle_color_picker_mode
                                  else:
                                    - if:
                                        condition:
                                          lambda: 'return id(in_light_selector);'
                                        then:
                                          - script.execute: light_selector_confirm
                                        else:
                                          - if:
                                              condition:
                                                lambda: 'return id(in_entity_selector);'
                                              then:
                                                - script.execute: entity_selector_confirm
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: 'return id(in_menu);'
                                                    then:
                                                      - script.execute: dial_enter_selected
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: 'return id(in_light);'
                                                          then:
                                                            - script.execute: toggle_light_onoff
                                                          else:
                                                            - if:
                                                                condition:
                                                                  lambda: 'return id(in_cover);'
                                                                then:
                                                                  - script.execute: toggle_cover
                                                                else:
                                                                  - if:
                                                                      condition:
                                                                        lambda: 'return id(in_switch);'
                                                                      then:
                                                                        - script.execute: toggle_switch
                                                                      else:
                                                                        - if:
                                                                            condition:
                                                                              lambda: 'return id(in_scene);'
                                                                            then:
                                                                              - script.execute: activate_scene
                                                                            else:
                                                                              - if:
                                                                                  condition:
                                                                                    lambda: 'return id(in_air) || id(in_music);'
                                                                                  then:
                                                                                    - script.execute: dial_back

  - id: dial_back
    then:
      - script.execute:
          id: dial_register_activity
          source: "button"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - lambda: |-
                if (id(in_light_selector)) {
                  id(close_light_selector).execute();
                  return;
                }
                if (id(in_entity_selector)) {
                  id(close_entity_selector).execute();
                  return;
                }
                if (id(in_menu)) {
                  id(close_menu).execute();
                  return;
                }
                if (id(in_light)) {
                  if (id(dial_lights_id).light_count() > 1) {
                    id(in_light) = false;
                    id(open_light_selector_back).execute();
                  } else {
                    id(close_light).execute();
                  }
                  return;
                }
                if (id(in_colorpicker)) {
                  id(close_light).execute();
                  return;
                }
                if (id(in_cover)) {
                  id(close_cover).execute();
                  return;
                }
                if (id(in_switch)) {
                  id(close_switch).execute();
                  return;
                }
                if (id(in_scene)) {
                  id(close_scene).execute();
                  return;
                }
                if (id(in_air)) {
                  id(close_air).execute();
                  return;
                }
                if (id(in_music)) {
                  id(close_music).execute();
                  return;
                }
                if (id(in_timer)) {
                  id(close_timer).execute();
                  return;
                }
                id(open_menu).execute();

  # Count raw presses. delayed_on_off ate short single taps; on_multi_click
  # cancelled them during the release wait. Bounce closer than 80ms is one press.
  - id: dial_button_decide
    mode: restart
    then:
      - delay: 280ms
      - lambda: |-
          const int n = id(button_press_count);
          id(button_press_count) = 0;
          ESP_LOGI("button", "decide n=%d", n);
          if (n >= 2) {
            id(dial_back).execute();
          } else if (n == 1) {
            id(dial_simple_click).execute();
          }

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a:
      number: GPIO40
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO41
      mode: INPUT_PULLUP
    resolution: 4
    on_clockwise:
      - script.execute:
          id: dial_register_activity
          source: "encoder"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - lambda: |-
                if (id(in_light_selector)) {
                  if (id(selector_carousel).is_animating()) return;
                  const int before = id(light_selector_encoder_accum);
                  const int after = before + 1;
                  id(light_selector_encoder_accum) = after;
                  if (after < 4) return;
                  id(light_selector_encoder_accum) = 0;
                  id(light_selector_scroll_down).execute();
                  return;
                }
                if (id(in_entity_selector)) {
                  if (id(entity_selector_carousel).is_animating()) return;
                  const int before = id(entity_selector_encoder_accum);
                  const int after = before + 1;
                  id(entity_selector_encoder_accum) = after;
                  if (after < 4) return;
                  id(entity_selector_encoder_accum) = 0;
                  id(entity_selector_scroll_down).execute();
                  return;
                }
                if (id(in_colorpicker)) {
                  if (id(light_color_picker_mode) == 1) id(light_kelvin_up).execute();
                  else id(light_hue_up).execute();
                  return;
                }
                if (id(in_light) && !id(in_menu)) {
                  id(light_brightness_up).execute();
                  return;
                }
                if (id(in_air) && !id(in_menu)) {
                  if (id(air_encoder_step_accum) < 0) id(air_encoder_step_accum) = 0;
                  id(air_encoder_step_accum) += 1;
                  if (id(air_encoder_step_accum) >= 4) {
                    id(air_encoder_step_accum) = 0;
                    if (id(air_control_mode) == 0) id(air_temp_up).execute();
                    else if (id(air_control_mode) == 1) id(air_fan_step).execute(1);
                    else id(air_hvac_step).execute(1);
                  }
                  return;
                }
                if (id(in_music)) {
                  id(music_volume_up).execute();
                  return;
                }
                if (id(in_cover)) {
                  id(cover_position_up).execute();
                  return;
                }
                if (id(in_menu)) {
                  id(menu_scroll_down).execute();
                  return;
                }
                if (id(in_timer)) {
                  id(timer_encoder_up).execute();
                }
    on_anticlockwise:
      - script.execute:
          id: dial_register_activity
          source: "encoder"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - lambda: |-
                if (id(in_light_selector)) {
                  if (id(selector_carousel).is_animating()) return;
                  const int before = id(light_selector_encoder_accum);
                  const int after = before - 1;
                  id(light_selector_encoder_accum) = after;
                  if (after > -4) return;
                  id(light_selector_encoder_accum) = 0;
                  id(light_selector_scroll_up).execute();
                  return;
                }
                if (id(in_entity_selector)) {
                  if (id(entity_selector_carousel).is_animating()) return;
                  const int before = id(entity_selector_encoder_accum);
                  const int after = before - 1;
                  id(entity_selector_encoder_accum) = after;
                  if (after > -4) return;
                  id(entity_selector_encoder_accum) = 0;
                  id(entity_selector_scroll_up).execute();
                  return;
                }
                if (id(in_colorpicker)) {
                  if (id(light_color_picker_mode) == 1) id(light_kelvin_down).execute();
                  else id(light_hue_down).execute();
                  return;
                }
                if (id(in_light) && !id(in_menu)) {
                  id(light_brightness_down).execute();
                  return;
                }
                if (id(in_air) && !id(in_menu)) {
                  if (id(air_encoder_step_accum) > 0) id(air_encoder_step_accum) = 0;
                  id(air_encoder_step_accum) -= 1;
                  if (id(air_encoder_step_accum) <= -4) {
                    id(air_encoder_step_accum) = 0;
                    if (id(air_control_mode) == 0) id(air_temp_down).execute();
                    else if (id(air_control_mode) == 1) id(air_fan_step).execute(-1);
                    else id(air_hvac_step).execute(-1);
                  }
                  return;
                }
                if (id(in_music)) {
                  id(music_volume_down).execute();
                  return;
                }
                if (id(in_cover)) {
                  id(cover_position_down).execute();
                  return;
                }
                if (id(in_menu)) {
                  id(menu_scroll_up).execute();
                  return;
                }
                if (id(in_timer)) {
                  id(timer_encoder_down).execute();
                }

  - platform: homeassistant
    id: ha_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_temp
            text: !lambda |-
              static char buf[8];
              sprintf(buf, "%.0f\xc2\xb0", x);
              return buf;

  - platform: homeassistant
    id: ha_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_humidity
            text: !lambda |-
