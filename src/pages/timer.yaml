color:
  - id: col_timer_bg
    hex: "000000"
  - id: col_timer_track
    hex: "1e1e1e"
  - id: col_timer_green
    hex: "4ade80"
  - id: col_timer_orange
    hex: "fb923c"
  - id: col_timer_red
    hex: "f87171"
  - id: col_timer_green_dim
    hex: "166534"
  - id: col_timer_dim_text
    hex: "555555"
  - id: col_timer_btn_bg
    hex: "1a1a1a"
  - id: col_timer_btn_border
    hex: "2d2d2d"

font:
  - file:
      family: Share Tech Mono
      weight: 400
      type: gfonts
    id: font_timer_time
    size: 42
    bpp: 4
    glyphs: "0123456789:-"

  - file:
      family: DM+Sans
      weight: 600
      type: gfonts
    id: font_timer_btn
    size: 11
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ "

globals:
  - id: in_timer
    type: bool
    initial_value: 'false'
  # 0=IDLE, 1=ACTIVE, 2=PAUSED, 3=FINISHED, 4=UNAVAILABLE
  - id: timer_ui_state
    type: int
    initial_value: '0'
  - id: timer_selected_seconds
    type: int
    initial_value: '300'
  - id: timer_ha_default_seconds
    type: int
    initial_value: '300'
  - id: timer_selection_dirty
    type: bool
    initial_value: 'false'
  - id: timer_remaining_seconds
    type: int
    initial_value: '300'
  - id: timer_duration_seconds
    type: int
    initial_value: '300'
  - id: timer_finish_epoch_utc
    type: int64_t
    initial_value: '0'
  - id: timer_active_cycle_finish_epoch
    type: int64_t
    initial_value: '0'
  - id: timer_unit
    type: int
    initial_value: '-1'
  - id: timer_blink
    type: bool
    initial_value: 'true'
  - id: timer_sync_ready
    type: bool
    initial_value: 'false'
  - id: timer_action_pending
    type: bool
    initial_value: 'false'
  # 0=none, 1=start/resume, 2=pause, 3=cancel
  - id: timer_pending_action
    type: int
    initial_value: '0'
  - id: timer_observed_active_cycle
    type: bool
    initial_value: 'false'
  - id: timer_finish_feedback_sent
    type: bool
    initial_value: 'false'
  - id: timer_finished_visible_until_ms
    type: uint32_t
    initial_value: '0'

text_sensor:
  - platform: homeassistant
    id: ha_timer_state
    entity_id: ${timer_entity}
    internal: true
    on_value:
      - script.execute: timer_schedule_sync

  - platform: homeassistant
    id: ha_timer_remaining
    entity_id: ${timer_entity}
    attribute: remaining
    internal: true
    on_value:
      - script.execute: timer_schedule_sync

  - platform: homeassistant
    id: ha_timer_duration
    entity_id: ${timer_entity}
    attribute: duration
    internal: true
    on_value:
      - script.execute: timer_schedule_sync

  - platform: homeassistant
    id: ha_timer_finishes_at
    entity_id: ${timer_entity}
    attribute: finishes_at
    internal: true
    on_value:
      - script.execute: timer_schedule_sync

interval:
  - interval: 1s
    then:
      - lambda: |-
          const int ACTIVE = 1;
          const int FINISHED = 3;
          const int UNAVAILABLE = 4;
          if (!id(ha_connected)) {
            id(timer_ui_state) = UNAVAILABLE;
            id(timer_sync_ready) = false;
          }
          if (id(timer_ui_state) == ACTIVE && id(timer_finish_epoch_utc) > 0) {
            auto now = id(esptime).now();
            if (now.is_valid()) {
              const int previous = id(timer_remaining_seconds);
              const int64_t delta = id(timer_finish_epoch_utc) - now.timestamp;
              const int remaining = delta > 0 ? (int) delta : 0;
              id(timer_remaining_seconds) = remaining;
              if (previous > 0 && remaining == 0 &&
                  id(timer_observed_active_cycle) &&
                  !id(timer_finish_feedback_sent) &&
                  id(ha_timer_state).state == "active") {
                id(timer_ui_state) = FINISHED;
                id(timer_finish_feedback_sent) = true;
                id(timer_finished_visible_until_ms) = millis() + 2500;
                id(timer_blink) = true;
                id(timer_finish_beep).execute();
              }
            }
          }
          if (id(timer_ui_state) == FINISHED) {
            id(timer_blink) = !id(timer_blink);
            if (id(ha_timer_state).state == "idle" &&
                (int32_t) (millis() - id(timer_finished_visible_until_ms)) >= 0) {
              id(timer_ui_state) = 0;
              id(timer_finish_epoch_utc) = 0;
              id(timer_active_cycle_finish_epoch) = 0;
              id(timer_observed_active_cycle) = false;
              id(timer_finish_feedback_sent) = false;
              id(timer_finished_visible_until_ms) = 0;
              id(timer_blink) = true;
              if (!id(timer_selection_dirty)) {
                id(timer_selected_seconds) = id(timer_ha_default_seconds);
                id(timer_duration_seconds) = id(timer_ha_default_seconds);
              }
              id(timer_remaining_seconds) = id(timer_selected_seconds);
            }
          }
          if (id(in_timer)) id(refresh_timer).execute();

script:
  - id: timer_finish_beep
    then:
      - rtttl.play: "timer_finish:d=16,o=6,b=180:c,e,g"

  - id: timer_schedule_sync
    mode: restart
    then:
      - delay: 150ms
      - script.execute: timer_sync_from_ha

  - id: timer_sync_from_ha
    mode: restart
    then:
      - lambda: |-
          const int IDLE = 0;
          const int ACTIVE = 1;
          const int PAUSED = 2;
          const int FINISHED = 3;
          const int UNAVAILABLE = 4;

          auto parse_duration = [](const std::string &value, int *seconds) -> bool {
            int h, m, s;
            char tail;
            if (sscanf(value.c_str(), "%d:%d:%d%c", &h, &m, &s, &tail) != 3 ||
                h < 0 || m < 0 || m > 59 || s < 0 || s > 59) return false;
            const int64_t total = (int64_t) h * 3600 + m * 60 + s;
            if (total < 0 || total > 2147483647LL) return false;
            *seconds = (int) total;
            return true;
          };

          auto parse_finishes_at = [](const std::string &value, int64_t *epoch) -> bool {
            if (value.size() < 20) return false;
            int year, month, day, hour, minute, second;
            if (sscanf(value.c_str(), "%4d-%2d-%2dT%2d:%2d:%2d",
                       &year, &month, &day, &hour, &minute, &second) != 6 ||
                month < 1 || month > 12 || day < 1 || hour < 0 || hour > 23 ||
                minute < 0 || minute > 59 || second < 0 || second > 59) return false;
            const int month_days[] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};
            const bool leap = (year % 4 == 0 && (year % 100 != 0 || year % 400 == 0));
            const int max_day = month_days[month - 1] + (month == 2 && leap ? 1 : 0);
            if (day > max_day) return false;

            size_t pos = 19;
            if (pos < value.size() && value[pos] == '.') {
              ++pos;
              const size_t fraction_start = pos;
              while (pos < value.size() && value[pos] >= '0' && value[pos] <= '9') ++pos;
              if (pos == fraction_start) return false;
            }
            int offset_seconds = 0;
            if (pos < value.size() && value[pos] == 'Z') {
              ++pos;
            } else if (pos + 6 == value.size() && (value[pos] == '+' || value[pos] == '-') &&
                       value[pos + 3] == ':') {
              const int offset_h = (value[pos + 1] - '0') * 10 + (value[pos + 2] - '0');
              const int offset_m = (value[pos + 4] - '0') * 10 + (value[pos + 5] - '0');
              if (value[pos + 1] < '0' || value[pos + 1] > '9' ||
                  value[pos + 2] < '0' || value[pos + 2] > '9' ||
                  value[pos + 4] < '0' || value[pos + 4] > '9' ||
                  value[pos + 5] < '0' || value[pos + 5] > '9' ||
                  offset_h > 23 || offset_m > 59) return false;
              offset_seconds = offset_h * 3600 + offset_m * 60;
              if (value[pos] == '-') offset_seconds = -offset_seconds;
              pos += 6;
            } else {
              return false;
            }
            if (pos != value.size()) return false;

            int adjusted_year = year - (month <= 2 ? 1 : 0);
            const int era = (adjusted_year >= 0 ? adjusted_year : adjusted_year - 399) / 400;
            const unsigned year_of_era = (unsigned) (adjusted_year - era * 400);
            const unsigned day_of_year = (153 * (month + (month > 2 ? -3 : 9)) + 2) / 5 + day - 1;
            const unsigned day_of_era = year_of_era * 365 + year_of_era / 4 - year_of_era / 100 + day_of_year;
            const int64_t days_since_epoch = (int64_t) era * 146097 + day_of_era - 719468;
            *epoch = days_since_epoch * 86400 + hour * 3600 + minute * 60 + second - offset_seconds;
            return true;
          };

          const std::string state = id(ha_timer_state).state;
          if (!id(ha_connected) || state.empty() || state == "unknown" || state == "unavailable") {
            id(timer_ui_state) = UNAVAILABLE;
            id(timer_sync_ready) = false;
            id(refresh_timer).execute();
            return;
          }

          int imported_duration = 0;
          if (parse_duration(id(ha_timer_duration).state, &imported_duration) && imported_duration > 0) {
            id(timer_ha_default_seconds) = imported_duration;
            id(timer_duration_seconds) = imported_duration;
          }

          if (state == "idle") {
            if (id(timer_pending_action) == 3) {
              id(timer_action_pending) = false;
              id(timer_pending_action) = 0;
            }
            id(timer_sync_ready) = true;
            if (id(timer_ui_state) == FINISHED &&
                (int32_t) (millis() - id(timer_finished_visible_until_ms)) < 0) {
              id(refresh_timer).execute();
              return;
            }
            id(timer_ui_state) = IDLE;
            id(timer_finish_epoch_utc) = 0;
            id(timer_active_cycle_finish_epoch) = 0;
            id(timer_observed_active_cycle) = false;
            id(timer_finish_feedback_sent) = false;
            id(timer_finished_visible_until_ms) = 0;
            id(timer_blink) = true;
            if (!id(timer_selection_dirty)) {
              id(timer_selected_seconds) = id(timer_ha_default_seconds);
              id(timer_duration_seconds) = id(timer_ha_default_seconds);
            }
            id(timer_remaining_seconds) = id(timer_selected_seconds);
            id(refresh_timer).execute();
            return;
          }

          if (state == "paused") {
            int imported_remaining = 0;
            if (parse_duration(id(ha_timer_remaining).state, &imported_remaining)) {
              id(timer_remaining_seconds) = imported_remaining;
            } else {
              ESP_LOGW("timer", "Invalid remaining from ${timer_entity}: %s", id(ha_timer_remaining).state.c_str());
            }
            id(timer_ui_state) = PAUSED;
            id(timer_finish_epoch_utc) = 0;
            id(timer_blink) = true;
            if (id(timer_pending_action) == 2) {
              id(timer_action_pending) = false;
              id(timer_pending_action) = 0;
            }
            id(timer_sync_ready) = true;
            id(refresh_timer).execute();
            return;
          }

          if (state == "active") {
            int64_t finish_epoch = 0;
            if (!parse_finishes_at(id(ha_timer_finishes_at).state, &finish_epoch)) {
              int imported_remaining = 0;
              if (parse_duration(id(ha_timer_remaining).state, &imported_remaining)) {
                id(timer_remaining_seconds) = imported_remaining;
              }
              id(timer_ui_state) = ACTIVE;
              id(timer_finish_epoch_utc) = 0;
              ESP_LOGW("timer", "Invalid finishes_at from ${timer_entity}: %s", id(ha_timer_finishes_at).state.c_str());
            } else {
              const bool new_cycle = !id(timer_observed_active_cycle) ||
                                     id(timer_active_cycle_finish_epoch) != finish_epoch;
              id(timer_finish_epoch_utc) = finish_epoch;
              if (new_cycle) {
                id(timer_observed_active_cycle) = true;
                id(timer_active_cycle_finish_epoch) = finish_epoch;
                id(timer_finish_feedback_sent) = false;
                id(timer_finished_visible_until_ms) = 0;
                id(timer_blink) = true;
                id(timer_ui_state) = ACTIVE;
              }
              auto now = id(esptime).now();
              if (now.is_valid()) {
                const int64_t delta = finish_epoch - now.timestamp;
                id(timer_remaining_seconds) = delta > 0 ? (int) delta : 0;
              } else {
                int imported_remaining = 0;
                if (parse_duration(id(ha_timer_remaining).state, &imported_remaining)) {
                  id(timer_remaining_seconds) = imported_remaining;
                }
              }
              if (id(timer_ui_state) != FINISHED || new_cycle) id(timer_ui_state) = ACTIVE;
            }
            if (id(timer_pending_action) == 1) {
              id(timer_action_pending) = false;
              id(timer_pending_action) = 0;
            }
            id(timer_selection_dirty) = false;
            id(timer_sync_ready) = true;
            id(refresh_timer).execute();
            return;
          }

          ESP_LOGW("timer", "Unexpected state from ${timer_entity}: %s", state.c_str());
          id(timer_ui_state) = UNAVAILABLE;
          id(timer_sync_ready) = false;
          id(refresh_timer).execute();

  - id: timer_action_timeout
    mode: restart
    then:
      - delay: 3s
      - lambda: |-
          if (id(timer_action_pending)) {
            ESP_LOGW("timer", "Timed out waiting for ${timer_entity} state confirmation");
            id(timer_action_pending) = false;
            id(timer_pending_action) = 0;
          }
      - script.execute: timer_schedule_sync

  - id: timer_start_new
    then:
      - if:
          condition:
            lambda: 'return id(timer_ui_state) == 0 && id(timer_sync_ready) && !id(timer_action_pending) && id(ha_connected) && id(timer_selected_seconds) > 0;'
          then:
            - lambda: |-
                id(timer_action_pending) = true;
                id(timer_pending_action) = 1;
            - homeassistant.action:
                action: timer.start
                data:
                  entity_id: ${timer_entity}
                data_template:
                  duration: !lambda |-
                    const int total = id(timer_selected_seconds);
                    char duration[9];
                    snprintf(duration, sizeof(duration), "%02d:%02d:%02d", total / 3600, (total % 3600) / 60, total % 60);
                    return std::string(duration);
            - script.execute: timer_action_timeout

  - id: timer_pause
    then:
      - if:
          condition:
            lambda: 'return id(timer_ui_state) == 1 && id(timer_sync_ready) && !id(timer_action_pending) && id(ha_connected);'
          then:
            - lambda: |-
                id(timer_action_pending) = true;
                id(timer_pending_action) = 2;
            - homeassistant.action:
                action: timer.pause
                data:
                  entity_id: ${timer_entity}
            - script.execute: timer_action_timeout

  - id: timer_resume
    then:
      - if:
          condition:
            lambda: 'return id(timer_ui_state) == 2 && id(timer_sync_ready) && !id(timer_action_pending) && id(ha_connected);'
          then:
            - lambda: |-
                id(timer_action_pending) = true;
                id(timer_pending_action) = 1;
            - homeassistant.action:
                action: timer.start
                data:
                  entity_id: ${timer_entity}
            - script.execute: timer_action_timeout

  - id: timer_cancel
    then:
      - if:
          condition:
            lambda: 'return (id(timer_ui_state) == 1 || id(timer_ui_state) == 2) && id(timer_sync_ready) && !id(timer_action_pending) && id(ha_connected);'
          then:
            - lambda: |-
                id(timer_action_pending) = true;
                id(timer_pending_action) = 3;
            - homeassistant.action:
                action: timer.cancel
                data:
                  entity_id: ${timer_entity}
            - script.execute: timer_action_timeout

  - id: open_timer
    then:
      - globals.set: {id: in_timer, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - script.execute: timer_schedule_sync
      - script.execute: refresh_timer
      - lvgl.page.show:
          id: page_timer
          animation: MOVE_LEFT

  - id: close_timer
    then:
      - globals.set: {id: in_timer, value: 'false'}
      - script.execute: open_menu

  - id: timer_toggle
    then:
      - if:
          condition:
            lambda: 'return id(timer_ui_state) == 0;'
          then:
            - script.execute: timer_start_new
          else:
            - if:
                condition:
                  lambda: 'return id(timer_ui_state) == 1;'
                then:
                  - script.execute: timer_pause
                else:
                  - if:
                      condition:
                        lambda: 'return id(timer_ui_state) == 2;'
                      then:
                        - script.execute: timer_resume

  - id: timer_reset_or_cancel
    then:
      - if:
          condition:
            lambda: 'return id(timer_ui_state) == 0;'
          then:
            - lambda: |-
                id(timer_selected_seconds) = id(timer_ha_default_seconds);
                id(timer_remaining_seconds) = id(timer_ha_default_seconds);
                id(timer_duration_seconds) = id(timer_ha_default_seconds);
                id(timer_selection_dirty) = false;
                id(timer_unit) = -1;
            - script.execute: refresh_timer
          else:
            - script.execute: timer_cancel

  - id: timer_encoder_up
    then:
      - lambda: |-
          if (id(timer_ui_state) != 0) return;
          const int unit = id(timer_unit);
          int h = id(timer_selected_seconds) / 3600;
          int m = (id(timer_selected_seconds) % 3600) / 60;
          int s = id(timer_selected_seconds) % 60;
          const int before = id(timer_selected_seconds);
          if (unit == 0) h = (h + 1) % 24;
          else if (unit == 1) m = (m + 1) % 60;
          else if (unit == 2) s = (s + 1) % 60;
          id(timer_selected_seconds) = h * 3600 + m * 60 + s;
          id(timer_remaining_seconds) = id(timer_selected_seconds);
          id(timer_duration_seconds) = id(timer_selected_seconds);
          if (id(timer_selected_seconds) != before) id(timer_selection_dirty) = true;
      - script.execute: refresh_timer

  - id: timer_encoder_down
    then:
      - lambda: |-
          if (id(timer_ui_state) != 0) return;
          const int unit = id(timer_unit);
          int h = id(timer_selected_seconds) / 3600;
          int m = (id(timer_selected_seconds) % 3600) / 60;
          int s = id(timer_selected_seconds) % 60;
          const int before = id(timer_selected_seconds);
          if (unit == 0) h = (h + 23) % 24;
          else if (unit == 1) m = (m + 59) % 60;
          else if (unit == 2) s = (s + 59) % 60;
          id(timer_selected_seconds) = h * 3600 + m * 60 + s;
          id(timer_remaining_seconds) = id(timer_selected_seconds);
          id(timer_duration_seconds) = id(timer_selected_seconds);
          if (id(timer_selected_seconds) != before) id(timer_selection_dirty) = true;
      - script.execute: refresh_timer

  - id: refresh_timer
    then:
      - lambda: |-
          const int IDLE = 0;
          const int ACTIVE = 1;
          const int PAUSED = 2;
          const int FINISHED = 3;
          const int UNAVAILABLE = 4;
          const int state = id(timer_ui_state);
          const bool editing = state == IDLE;
          const bool done = state == FINISHED;
          const bool unavailable = state == UNAVAILABLE;
          const int shown = editing ? id(timer_selected_seconds) : id(timer_remaining_seconds);
          const int duration = editing ? id(timer_selected_seconds) : id(timer_duration_seconds);
          float pct = editing ? 1.0f : (duration > 0 ? (float) shown / duration : 0.0f);
          if (pct < 0.0f) pct = 0.0f;
          else if (pct > 1.0f) pct = 1.0f;

          lv_color_t accent, dim;
          if (done) {
            accent = lv_color_hex(0xf87171);
            dim = lv_color_hex(0x7f1d1d);
          } else if (unavailable) {
            accent = lv_color_hex(0x555555);
            dim = lv_color_hex(0x222222);
          } else if (editing || pct > 0.5f) {
            accent = lv_color_hex(0x4ade80);
            dim = lv_color_hex(0x166534);
          } else if (pct > 0.2f) {
            accent = lv_color_hex(0xfb923c);
            dim = lv_color_hex(0x9a3412);
          } else {
            accent = lv_color_hex(0xf87171);
            dim = lv_color_hex(0x7f1d1d);
          }
          lv_arc_set_value(id(arc_timer), (int) (pct * 100.0f));
          lv_obj_set_style_arc_color(id(arc_timer), accent, LV_PART_INDICATOR);

          if (unavailable) {
            lv_label_set_text(id(lbl_timer_time), "--:--:--");
            lv_obj_set_style_text_color(id(lbl_timer_time), accent, 0);
          } else {
            const int safe_shown = shown < 0 ? 0 : shown;
            char text[9];
            snprintf(text, sizeof(text), "%02d:%02d:%02d", safe_shown / 3600,
                     (safe_shown % 3600) / 60, safe_shown % 60);
            lv_label_set_text(id(lbl_timer_time), text);
            lv_obj_set_style_text_color(id(lbl_timer_time),
              done && !id(timer_blink) ? lv_color_hex(0x222222) :
              (done ? accent : lv_color_hex(0xffffff)), 0);
          }

          lv_obj_t *unit_buttons[3] = {id(btn_timer_h), id(btn_timer_m), id(btn_timer_s)};
          for (int i = 0; i < 3; i++) {
            const bool selected = editing && id(timer_unit) == i;
            lv_obj_set_style_bg_color(unit_buttons[i], selected ? dim : lv_color_hex(0x1a1a1a), LV_PART_MAIN);
            lv_obj_set_style_border_color(unit_buttons[i], selected ? accent : lv_color_hex(0x2d2d2d), LV_PART_MAIN);
            lv_obj_t *child = lv_obj_get_child(unit_buttons[i], 0);
            if (child) lv_obj_set_style_text_color(child, selected ? accent : lv_color_hex(0x555555), 0);
          }
          lv_label_set_text(id(lbl_timer_reset), (state == ACTIVE || state == PAUSED) ? "CANCEL" : "RST");

lvgl:
  pages:
    - id: page_timer
      bg_color: col_timer_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            align: TOP_LEFT
            x: 0
            y: 0
            width: 240
            height: 240
            radius: 120
            clip_corner: true
            bg_color: col_timer_bg
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - arc:
                  id: arc_timer
                  align: CENTER
                  width: 232
                  height: 232
                  rotation: 270
                  start_angle: 0
                  end_angle: 360
                  min_value: 0
                  max_value: 100
                  value: 100
                  arc_color: col_timer_track
                  arc_width: 8
                  arc_opa: COVER
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_color: col_timer_green
                    arc_width: 8
                    arc_opa: COVER
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                    width: 0
                    height: 0
              - label:
                  id: lbl_timer_time
                  align: CENTER
                  y: -16
                  text: "00:05:00"
                  text_font: font_timer_time
                  text_color: 0xFFFFFF
              - obj:
                  id: btn_timer_h
                  align: CENTER
                  x: -65
                  y: 24
