globals:
  - id: in_cover
    type: bool
    initial_value: 'false'
  # 0 = shutters (dial_covers), 1 = garage / gate (dial_garages)
  - id: cover_page_kind
    type: int
    initial_value: '0'
  - id: cover_position
    type: int
    initial_value: '0'
  - id: cover_user_adjusting
    type: bool
    initial_value: 'false'

font:
  - file:
      family: DM+Sans
      weight: 700
      type: gfonts
    id: font_cover_btn
    size: 12
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ "

color:
  - id: col_cover_bg
    hex: "000000"
  - id: col_cover_track
    hex: "282729"
  - id: col_cover_accent
    hex: "2DD4BF"
  - id: col_cover_btn
    hex: "08201C"
  - id: col_cover_label_bg
    hex: "1A2A28"

script:
  - id: refresh_cover
    mode: restart
    then:
      - lambda: |-
          auto *list = (id(cover_page_kind) == 1) ? id(dial_garages_id) : id(dial_covers_id);
          const bool garage = id(cover_page_kind) == 1;
          const uint32_t accent = garage ? 0xF97316 : 0x2DD4BF;
          const uint32_t track = 0x282729;
          const uint32_t btn = garage ? 0x201208 : 0x08201C;
          const uint32_t pill = garage ? 0x2A1A10 : 0x1A2A28;

          if (garage) {
            lv_obj_add_flag(id(cover_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_cover_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_cover_pct), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_open_close), LV_OBJ_FLAG_HIDDEN);

            lv_obj_set_align(id(cover_open_close), LV_ALIGN_CENTER);
            lv_obj_set_y(id(cover_open_close), 0);
            lv_obj_set_size(id(btn_cover_open), 80, 44);
            lv_obj_set_size(id(btn_cover_close), 80, 44);
            lv_obj_set_y(id(cover_title_pill), 28);
            lv_obj_set_y(id(btn_cover_stop), -24);
          } else {
            lv_obj_clear_flag(id(cover_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_cover_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_cover_pct), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_open_close), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_align(id(cover_open_close), LV_ALIGN_TOP_MID);
            lv_obj_set_size(id(btn_cover_open), 76, 32);
            lv_obj_set_size(id(btn_cover_close), 76, 32);

            char buf[8];
            snprintf(buf, sizeof(buf), "%d", id(cover_position));
            lv_label_set_text(id(lbl_cover_num), buf);
            lv_obj_update_layout(id(lbl_cover_num));
            lv_coord_t nw = lv_obj_get_width(id(lbl_cover_num));
            int pct_w = 12, gap = 3;
            int pair_x = 120 - (nw + gap + pct_w) / 2;
            lv_obj_set_pos(id(lbl_cover_num), pair_x, 32);
            lv_obj_set_pos(id(lbl_cover_pct), pair_x + nw + gap, 50);
            if (lv_arc_get_value(id(cover_arc)) != id(cover_position))
              lv_arc_set_value(id(cover_arc), id(cover_position));
            lv_obj_set_style_arc_color(id(cover_arc), lv_color_hex(track), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(cover_arc), lv_color_hex(accent), LV_PART_INDICATOR);
            lv_obj_set_y(id(cover_title_pill), 98);
            lv_obj_set_y(id(cover_open_close), 132);
            lv_obj_set_y(id(btn_cover_stop), -8);
          }

          lv_obj_set_style_text_color(id(lbl_cover_pct), lv_color_hex(accent), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_cover_title), lv_color_hex(accent), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_cover_open), lv_color_hex(accent), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_cover_close), lv_color_hex(accent), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(cover_title_pill), lv_color_hex(pill), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_cover_open), lv_color_hex(btn), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_cover_stop), lv_color_hex(btn), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_cover_close), lv_color_hex(btn), LV_PART_MAIN);
          lv_label_set_text(id(lbl_cover_title), list->active_name().c_str());
          lv_label_set_text(id(lbl_cover_open), dial_i18n::cover_open_btn());
          lv_label_set_text(id(lbl_cover_stop), dial_i18n::cover_stop_btn());
          lv_label_set_text(id(lbl_cover_close), dial_i18n::cover_close_btn());
          if (!garage) {
            lv_obj_invalidate(id(lbl_cover_num));
            lv_obj_invalidate(id(lbl_cover_pct));
            lv_obj_invalidate(id(cover_arc));
          } else {
            lv_obj_invalidate(id(cover_open_close));
          }
          lv_obj_invalidate(id(cover_overlay));
          lv_obj_move_foreground(id(cover_overlay));

  - id: cover_apply_snapshot
    mode: restart
    then:
      - lambda: |-
          if (id(cover_page_kind) == 1) {
            id(refresh_cover).execute();
            return;
          }
          auto *list = id(dial_covers_id);
          const int pos = list->active_position();
          if (pos < 0)
            return;
          const int local = id(cover_position);
          const int delta = pos > local ? pos - local : local - pos;
          if (id(cover_user_adjusting) && delta <= 5)
            return;
          id(cover_position) = pos;
          if (delta > 5)
            id(cover_user_adjusting) = false;
      - script.execute: refresh_cover

  - id: open_cover
    then:
      - globals.set: {id: in_cover, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: in_entity_selector, value: 'false'}
      - globals.set: {id: cover_user_adjusting, value: 'false'}
      - script.execute: cover_apply_snapshot
      - lvgl.page.show:
          id: page_cover
          animation: MOVE_LEFT

  - id: open_garage
    then:
      - globals.set: {id: cover_page_kind, value: '1'}
      - script.execute: open_cover

  - id: close_cover
    then:
      - globals.set: {id: in_cover, value: 'false'}
      - lambda: |-
          const bool garage = id(cover_page_kind) == 1;
          const size_t n = garage ? id(dial_garages_id).count() : id(dial_covers_id).count();
          if (n > 1) {
            id(entity_selector_kind) = garage ? 3 : 2;
            id(open_entity_selector_back).execute();
          } else {
            id(open_menu_back).execute();
          }

  - id: send_cover_position
    then:
      - homeassistant.action:
          action: cover.set_cover_position
          data_template:
            entity_id: "{{ target_entity }}"
            position: "{{ pos }}"
          variables:
            target_entity: !lambda |-
              if (id(cover_page_kind) == 1)
                return id(dial_garages_id).active_entity_id();
              return id(dial_covers_id).active_entity_id();
            pos: !lambda "return id(cover_position);"

  - id: queue_cover_position
    mode: restart
    then:
      - delay: 200ms
      - script.execute: send_cover_position
      - delay: 400ms
      - globals.set: {id: cover_user_adjusting, value: 'false'}

  - id: cover_position_up
    then:
      - lambda: |-
          if (id(cover_page_kind) == 1) return;
          int v = id(cover_position) + ${cover_position_step};
          if (v > 100) v = 100;
          id(cover_position) = v;
          id(cover_user_adjusting) = true;
          id(refresh_cover).execute();
          id(queue_cover_position).execute();

  - id: cover_position_down
    then:
      - lambda: |-
          if (id(cover_page_kind) == 1) return;
          int v = id(cover_position) - ${cover_position_step};
          if (v < 0) v = 0;
          id(cover_position) = v;
          id(cover_user_adjusting) = true;
          id(refresh_cover).execute();
          id(queue_cover_position).execute();

  - id: cover_open_action
    then:
      - homeassistant.action:
          action: cover.open_cover
          data_template:
            entity_id: "{{ target_entity }}"
          variables:
            target_entity: !lambda |-
              if (id(cover_page_kind) == 1)
                return id(dial_garages_id).active_entity_id();
              return id(dial_covers_id).active_entity_id();

  - id: cover_close_action
    then:
      - homeassistant.action:
          action: cover.close_cover
          data_template:
            entity_id: "{{ target_entity }}"
          variables:
            target_entity: !lambda |-
              if (id(cover_page_kind) == 1)
                return id(dial_garages_id).active_entity_id();
              return id(dial_covers_id).active_entity_id();

  - id: cover_stop_action
    then:
      - homeassistant.action:
          action: cover.stop_cover
          data_template:
            entity_id: "{{ target_entity }}"
          variables:
            target_entity: !lambda |-
              if (id(cover_page_kind) == 1)
                return id(dial_garages_id).active_entity_id();
              return id(dial_covers_id).active_entity_id();

  - id: toggle_cover
    then:
      - lambda: |-
          auto *list = (id(cover_page_kind) == 1) ? id(dial_garages_id) : id(dial_covers_id);
          const std::string &st = list->active_state();
          ESP_LOGI("cover", "toggle kind=%d state=%s pos=%d entity=%s", id(cover_page_kind), st.c_str(),
                   list->active_position(), list->active_entity_id().c_str());
          if (st == "opening" || st == "closing") {
            id(cover_stop_action).execute();
          } else if (list->cover_is_open_at(list->active_index())) {
            id(cover_close_action).execute();
          } else {
            id(cover_open_action).execute();
          }

interval:
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: 'return id(in_cover);'
          then:
            - script.execute: cover_apply_snapshot

lvgl:
  pages:
    - id: page_cover
      bg_color: col_cover_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            auto hook = []() {
              if (id(in_cover))
                id(cover_apply_snapshot).execute();
            };
            id(dial_covers_id).set_on_update(hook);
            id(dial_garages_id).set_on_update(hook);
            lv_obj_t *objs[] = {
              lv_scr_act(), id(cover_overlay), id(cover_title_pill), id(lbl_cover_title),
              id(cover_open_close), id(btn_cover_open), id(btn_cover_close), id(btn_cover_stop),
              id(lbl_cover_open), id(lbl_cover_close), id(lbl_cover_stop), id(lbl_cover_num),
              id(lbl_cover_pct)
            };
            for (lv_obj_t *obj : objs) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_set_scrollbar_mode(obj, LV_SCROLLBAR_MODE_OFF);
            }
        - script.execute: refresh_cover
      widgets:
        - obj:
            align: TOP_LEFT
            width: 240
            height: 240
            radius: 120
            clip_corner: true
            bg_color: col_cover_bg
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - arc:
                  id: cover_arc
                  x: 8
                  y: 8
                  width: 224
                  height: 224
                  rotation: 90
                  start_angle: 55
                  end_angle: 305
                  value: 0
                  min_value: 0
                  max_value: 100
                  arc_color: col_cover_track
                  arc_width: 14
                  arc_opa: COVER
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_color: col_cover_accent
                    arc_width: 14
                    arc_opa: COVER
                    arc_rounded: true
                  knob:
                    bg_color: 0xFFFFFF
                    bg_opa: COVER
                    border_width: 0
                    width: 12
                    height: 12
                    radius: 6
              - obj:
                  id: cover_overlay
                  align: TOP_LEFT
                  x: 0
                  y: 0
                  width: 240
                  height: 240
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lbl_cover_num
                        x: 72
                        y: 32
                        text: "0"
                        text_font: font_light_big
                        text_color: 0xFFFFFF
                        scrollbar_mode: "OFF"
                    - label:
                        id: lbl_cover_pct
                        x: 140
                        y: 50
                        text: "%"
                        text_font: font_light_pct
                        text_color: col_cover_accent
                        scrollbar_mode: "OFF"
                    - obj:
                        id: cover_title_pill
                        align: TOP_MID
                        x: 0
                        y: 98
                        width: 140
                        height: 28
                        radius: 14
                        bg_color: col_cover_label_bg
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        clip_corner: true
                        clickable: false
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              id: lbl_cover_title
                              align: CENTER
                              width: 124
                              text_align: CENTER
                              long_mode: DOT
                              text_font: font_menu_item
                              text_color: col_cover_accent
                              scrollbar_mode: "OFF"
                              text: ""
                    - obj:
                        id: cover_open_close
                        align: TOP_MID
                        y: 132
                        width: 168
                        height: 36
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - obj:
                              id: btn_cover_open
                              align: LEFT_MID
                              width: 76
                              height: 32
                              radius: 16
                              bg_color: col_cover_btn
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clip_corner: true
                              clickable: true
                              scrollbar_mode: "OFF"
                              on_click:
                                - script.execute: cover_open_action
                              widgets:
                                - label:
                                    id: lbl_cover_open
                                    align: CENTER
                                    clickable: false
                                    text_font: font_cover_btn
                                    text_color: col_cover_accent
                                    scrollbar_mode: "OFF"
                                    text: "OPEN"
                          - obj:
                              id: btn_cover_close
                              align: RIGHT_MID
                              width: 76
                              height: 32
                              radius: 16
                              bg_color: col_cover_btn
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              clip_corner: true
                              clickable: true
                              scrollbar_mode: "OFF"
                              on_click:
                                - script.execute: cover_close_action
                              widgets:
                                - label:
                                    id: lbl_cover_close
                                    align: CENTER
                                    clickable: false
                                    text_font: font_cover_btn
                                    text_color: col_cover_accent
                                    scrollbar_mode: "OFF"
                                    text: "CLOSE"
                    - obj:
                        id: btn_cover_stop
                        align: BOTTOM_MID
                        y: -8
                        width: 84
                        height: 32
                        radius: 16
                        bg_color: col_cover_btn
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        clip_corner: true
                        clickable: true
                        scrollbar_mode: "OFF"
                        on_click:
                          - script.execute: cover_stop_action
                        widgets:
                          - label:
                              id: lbl_cover_stop
                              align: CENTER
                              clickable: false
                              text_font: font_cover_btn
                              text_color: 0xFFFFFF
                              scrollbar_mode: "OFF"
                              text: "STOP"
