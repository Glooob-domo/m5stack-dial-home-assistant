globals:
  - id: air_temp
    type: int
    initial_value: '40'   # stored as 2x degrees
  - id: in_air
    type: bool
    initial_value: 'false'
  - id: air_control_mode
    type: int
    initial_value: '0'    # 0=temp, 1=fan_mode, 2=hvac_mode
  - id: air_btn_power_active
    type: bool
    initial_value: 'true'
  - id: air_encoder_step_accum
    type: int
    initial_value: '0'
  - id: air_hvac_modes_csv
    type: std::string
    initial_value: '""'
  - id: air_fan_modes_csv
    type: std::string
    initial_value: '""'
  - id: air_fan_modes_supported
    type: bool
    initial_value: 'false'
  - id: air_last_hvac_mode
    type: std::string
    initial_value: '""'
  - id: air_hvac_mode_pending
    type: std::string
    initial_value: '""'
  - id: air_fan_mode_pending
    type: std::string
    initial_value: '""'
  - id: air_last_valid_fan_mode
    type: std::string
    initial_value: '""'

sensor:
  - platform: homeassistant
    id: ha_air_target_temp
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      - lambda: 'id(air_temp) = (int)(x) * 2;'
      - script.execute: refresh_air
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: ha_air_current_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - script.execute: refresh_air
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: ha_air_humidity
    entity_id: ${climate_entity}
    attribute: current_humidity
    on_value:
      - script.execute: refresh_air

text_sensor:
  - platform: homeassistant
    id: ha_air_hvac_mode
    entity_id: ${climate_entity}
    on_value:
      - lambda: |-
          id(air_btn_power_active) = (x != "off" && x != "unknown" && x != "unavailable");
          if (x != "off" && x != "unknown" && x != "unavailable") {
            id(air_last_hvac_mode) = x;
            id(air_hvac_mode_pending) = x;
          }
      - script.execute: refresh_air
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: ha_air_hvac_modes
    entity_id: ${climate_entity}
    attribute: hvac_modes
    internal: true
    on_value:
      - script.execute: air_parse_hvac_modes

  - platform: homeassistant
    id: ha_air_fan_mode
    entity_id: ${climate_entity}
    attribute: fan_mode
    internal: true
    on_value:
      - lambda: |-
          if (x.empty()) return;
          std::string lower = x;
          for (char &c : lower) c = (char) std::tolower((unsigned char) c);
          if (lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null") return;
          id(air_fan_mode_pending) = x;
          id(air_last_valid_fan_mode) = x;
      - script.execute: refresh_air

  - platform: homeassistant
    id: ha_air_fan_modes
    entity_id: ${climate_entity}
    attribute: fan_modes
    internal: true
    on_value:
      - script.execute: air_parse_fan_modes

script:
  - id: open_air
    then:
      - globals.set: {id: in_air, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: air_encoder_step_accum, value: '0'}
      - lambda: |-
          id(air_hvac_mode_pending) = "";
          id(air_fan_mode_pending) = "";
      - script.execute: refresh_air
      - lvgl.page.show:
          id: page_air
          animation: MOVE_LEFT

  - id: close_air
    then:
      - globals.set: {id: in_air, value: 'false'}
      - globals.set: {id: air_encoder_step_accum, value: '0'}
      - script.execute: open_menu_back

  - id: air_temp_up
    then:
      - lambda: |-
          int v = id(air_temp) + 2;
          if (v > 52) v = 52;  // 26C
          id(air_temp) = v;
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda 'return std::to_string((int)(id(air_temp) / 2));'
      - script.execute: refresh_air

  - id: air_temp_down
    then:
      - lambda: |-
          int v = id(air_temp) - 2;
          if (v < 34) v = 34;  // 17C
          id(air_temp) = v;
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda 'return std::to_string((int)(id(air_temp) / 2));'
      - script.execute: refresh_air

  - id: air_parse_hvac_modes
    then:
      - lambda: |-
          static auto is_invalid = [](const std::string &s) -> bool {
            if (s.empty()) return true;
            std::string lower = s;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };
          static auto tokenize = [&](const std::string &raw, bool exclude_off) -> std::string {
            std::vector<std::string> modes;
            std::string token;
            for (size_t i = 0; i <= raw.size(); i++) {
              const char c = (i < raw.size()) ? raw[i] : '\0';
              if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '_') {
                token += (char) std::tolower((unsigned char) c);
              } else if (!token.empty()) {
                if (!is_invalid(token)) {
                  bool dup = false;
                  for (const auto &m : modes) {
                    if (m == token) { dup = true; break; }
                  }
                  if (!dup && !(exclude_off && token == "off")) {
                    modes.push_back(token);
                  }
                }
                token.clear();
              }
            }
            std::string csv;
            for (size_t i = 0; i < modes.size(); i++) {
              if (i) csv += '|';
              csv += modes[i];
            }
            return csv;
          };

          const std::string &raw = id(ha_air_hvac_modes).state;
          if (is_invalid(raw)) {
            id(air_hvac_modes_csv) = "";
            return;
          }
          id(air_hvac_modes_csv) = tokenize(raw, true);
      - script.execute: refresh_air

  - id: air_parse_fan_modes
    then:
      - lambda: |-
          static auto is_invalid = [](const std::string &s) -> bool {
            if (s.empty()) return true;
            std::string lower = s;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };
          static auto tokenize = [&](const std::string &raw) -> std::string {
            std::vector<std::string> modes;
            std::string token;
            for (size_t i = 0; i <= raw.size(); i++) {
              const char c = (i < raw.size()) ? raw[i] : '\0';
              if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '_') {
                token += (char) std::tolower((unsigned char) c);
              } else if (!token.empty()) {
                if (!is_invalid(token)) {
                  bool dup = false;
                  for (const auto &m : modes) {
                    if (m == token) { dup = true; break; }
                  }
                  if (!dup) modes.push_back(token);
                }
                token.clear();
              }
            }
            std::string csv;
            for (size_t i = 0; i < modes.size(); i++) {
              if (i) csv += '|';
              csv += modes[i];
            }
            return csv;
          };

          const std::string &raw = id(ha_air_fan_modes).state;
          if (is_invalid(raw)) {
            id(air_fan_modes_csv) = "";
            id(air_fan_modes_supported) = false;
            if (id(air_control_mode) == 1) id(air_control_mode) = 0;
            return;
          }
          const std::string csv = tokenize(raw);
          id(air_fan_modes_csv) = csv;
          id(air_fan_modes_supported) = !csv.empty();
          if (!id(air_fan_modes_supported) && id(air_control_mode) == 1) {
            id(air_control_mode) = 0;
          }
      - script.execute: refresh_air

  - id: air_toggle_fan_mode
    then:
      - lambda: |-
          if (!id(air_fan_modes_supported)) return;
          if (id(air_control_mode) == 1) {
            id(air_control_mode) = 0;
          } else {
            id(air_control_mode) = 1;
          }
          id(air_encoder_step_accum) = 0;
      - script.execute: refresh_air

  - id: air_toggle_hvac_mode
    then:
      - lambda: |-
          if (id(air_control_mode) == 2) {
            id(air_control_mode) = 0;
          } else {
            id(air_control_mode) = 2;
          }
          id(air_encoder_step_accum) = 0;
      - script.execute: refresh_air

  - id: air_confirm_edit
    then:
      - if:
          condition:
            lambda: 'return id(air_control_mode) != 0;'
          then:
            - globals.set: {id: air_control_mode, value: '0'}
            - globals.set: {id: air_encoder_step_accum, value: '0'}
            - rtttl.play: "b:d=16,o=6,b=200:c"
            - script.execute: refresh_air

  - id: air_power_toggle
    then:
      - if:
          condition:
            lambda: |-
              const std::string &s = id(ha_air_hvac_mode).state;
              return s != "unknown" && s != "unavailable";
          then:
            - if:
                condition:
                  lambda: 'return id(ha_air_hvac_mode).state == "off";'
                then:
                  - lambda: |-
                      static auto is_invalid = [](const std::string &s) -> bool {
                        if (s.empty()) return true;
                        std::string lower = s;
                        for (char &c : lower) c = (char) std::tolower((unsigned char) c);
                        return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null" || lower == "off";
                      };
                      static auto split_csv = [](const std::string &csv, std::vector<std::string> &out) {
                        out.clear();
                        size_t start = 0;
                        while (start <= csv.size()) {
                          size_t pos = csv.find('|', start);
                          if (pos == std::string::npos) pos = csv.size();
                          if (pos > start) out.push_back(csv.substr(start, pos - start));
                          if (pos == csv.size()) break;
                          start = pos + 1;
                        }
                      };
                      static auto mode_in_list = [](const std::string &mode, const std::vector<std::string> &modes) -> bool {
                        for (const auto &m : modes) {
                          if (m == mode) return true;
                        }
                        return false;
                      };

                      std::vector<std::string> modes;
                      split_csv(id(air_hvac_modes_csv), modes);
                      if (modes.empty()) {
                        ESP_LOGW("air", "air_power_toggle: no valid hvac mode to power on");
                        return;
                      }

                      std::string power_on_mode;
                      if (!is_invalid(id(air_last_hvac_mode)) && mode_in_list(id(air_last_hvac_mode), modes)) {
                        power_on_mode = id(air_last_hvac_mode);
                      } else if (!is_invalid(id(air_hvac_mode_pending)) && mode_in_list(id(air_hvac_mode_pending), modes)) {
                        power_on_mode = id(air_hvac_mode_pending);
                      } else {
                        power_on_mode = modes[0];
                      }

                      id(air_btn_power_active) = true;
                      id(air_hvac_mode_pending) = power_on_mode;
                      ESP_LOGI("air", "AIR_HA_ACTION power_on entity=${climate_entity} mode=%s", power_on_mode.c_str());
                  - if:
                      condition:
                        lambda: 'return !id(air_hvac_modes_csv).empty();'
                      then:
                        - homeassistant.service:
                            service: climate.set_hvac_mode
                            data:
                              entity_id: ${climate_entity}
                              hvac_mode: !lambda 'return id(air_hvac_mode_pending);'
                else:
                  - lambda: |-
                      id(air_btn_power_active) = false;
                      ESP_LOGI("air", "AIR_HA_ACTION turn_off entity=${climate_entity}");
                  - homeassistant.service:
                      service: climate.turn_off
                      data:
                        entity_id: ${climate_entity}
      - script.execute: refresh_air

  - id: air_fan_step
    parameters:
      direction: int
    then:
      - lambda: |-
          static auto is_invalid = [](const std::string &s) -> bool {
            if (s.empty()) return true;
            std::string lower = s;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };
          static auto split_csv = [](const std::string &csv, std::vector<std::string> &out) {
            out.clear();
            size_t start = 0;
            while (start <= csv.size()) {
              size_t pos = csv.find('|', start);
              if (pos == std::string::npos) pos = csv.size();
              if (pos > start) out.push_back(csv.substr(start, pos - start));
              if (pos == csv.size()) break;
              start = pos + 1;
            }
          };

          const std::string csv = id(air_fan_modes_csv);
          if (csv.empty()) {
            ESP_LOGW("air", "air_fan_step: fan_modes list empty, skipping service");
            return;
          }

          std::vector<std::string> modes;
          split_csv(csv, modes);
          if (modes.empty()) {
            ESP_LOGW("air", "air_fan_step: fan_modes list empty, skipping service");
            return;
          }

          std::string current;
          if (!is_invalid(id(air_fan_mode_pending))) {
            current = id(air_fan_mode_pending);
          } else if (id(ha_air_fan_mode).has_state() && !is_invalid(id(ha_air_fan_mode).state)) {
            current = id(ha_air_fan_mode).state;
          }

          size_t idx = 0;
          bool found = false;
          for (size_t i = 0; i < modes.size(); i++) {
            if (modes[i] == current) {
              idx = i;
              found = true;
              break;
            }
          }

          const int dir = direction;
          if (!found) {
            idx = (dir >= 0) ? 0 : (modes.size() - 1);
          } else if (dir >= 0) {
            idx = (idx + 1) % modes.size();
          } else {
            idx = (idx + modes.size() - 1) % modes.size();
          }

          id(air_fan_mode_pending) = modes[idx];
          id(air_last_valid_fan_mode) = modes[idx];
          ESP_LOGI("air", "AIR_HA_ACTION fan_mode entity=${climate_entity} mode=%s", modes[idx].c_str());
      - if:
          condition:
            lambda: 'return !id(air_fan_modes_csv).empty();'
          then:
            - homeassistant.service:
                service: climate.set_fan_mode
                data:
                  entity_id: ${climate_entity}
                  fan_mode: !lambda 'return id(air_fan_mode_pending);'
      - script.execute: refresh_air

  - id: air_hvac_step
    parameters:
      direction: int
    then:
      - lambda: |-
          static auto is_invalid = [](const std::string &s) -> bool {
            if (s.empty()) return true;
            std::string lower = s;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };
          static auto split_csv = [](const std::string &csv, std::vector<std::string> &out) {
            out.clear();
            size_t start = 0;
            while (start <= csv.size()) {
              size_t pos = csv.find('|', start);
              if (pos == std::string::npos) pos = csv.size();
              if (pos > start) out.push_back(csv.substr(start, pos - start));
              if (pos == csv.size()) break;
              start = pos + 1;
            }
          };

          const std::string csv = id(air_hvac_modes_csv);
          if (csv.empty()) {
            ESP_LOGW("air", "air_hvac_step: hvac_modes list empty, skipping service");
            return;
          }

          std::vector<std::string> modes;
          split_csv(csv, modes);
          if (modes.empty()) {
            ESP_LOGW("air", "air_hvac_step: hvac_modes list empty, skipping service");
            return;
          }

          std::string current;
          if (!is_invalid(id(air_hvac_mode_pending))) {
            current = id(air_hvac_mode_pending);
          } else if (id(ha_air_hvac_mode).has_state() && !is_invalid(id(ha_air_hvac_mode).state)) {
            current = id(ha_air_hvac_mode).state;
          }

          size_t idx = 0;
          bool found = false;
          for (size_t i = 0; i < modes.size(); i++) {
            if (modes[i] == current) {
              idx = i;
              found = true;
              break;
            }
          }

          const int dir = direction;
          if (!found) {
            idx = (dir >= 0) ? 0 : (modes.size() - 1);
          } else if (dir >= 0) {
            idx = (idx + 1) % modes.size();
          } else {
            idx = (idx + modes.size() - 1) % modes.size();
          }

          id(air_hvac_mode_pending) = modes[idx];
          id(air_last_hvac_mode) = modes[idx];
          ESP_LOGI("air", "AIR_HA_ACTION hvac_mode entity=${climate_entity} mode=%s", modes[idx].c_str());
      - if:
          condition:
            lambda: 'return !id(air_hvac_modes_csv).empty();'
          then:
            - homeassistant.service:
                service: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: !lambda 'return id(air_hvac_mode_pending);'
      - script.execute: refresh_air

  - id: refresh_air
    then:
      - lambda: |-
          static auto is_invalid = [](const std::string &s) -> bool {
            if (s.empty()) return true;
            std::string lower = s;
            for (char &c : lower) c = (char) std::tolower((unsigned char) c);
            return lower == "unknown" || lower == "unavailable" || lower == "none" || lower == "null";
          };
          static auto hvac_color = [](const std::string &mode) -> uint32_t {
            if (mode == "auto") return 0x22C55E;
            if (mode == "cool") return 0x00C5ED;
            if (mode == "heat") return 0xFF120C;
            if (mode == "fan_only") return 0x457AA6;
            if (mode == "dry") return 0xFACC15;
            if (mode == "off") return 0x6B7280;
            if (mode == "heat_cool") return 0xA78BFA;
            return 0xFFFFFF;
          };
          static auto format_mode_label = [](const std::string &mode, char *buf, size_t len) {
            if (mode == "auto") {
              snprintf(buf, len, "AUTO");
            } else if (mode == "cool") {
              snprintf(buf, len, "COOL");
            } else if (mode == "heat") {
              snprintf(buf, len, "HEAT");
            } else if (mode == "fan_only") {
              snprintf(buf, len, "FAN ONLY");
            } else if (mode == "dry") {
              snprintf(buf, len, "DRY");
            } else if (mode == "heat_cool") {
              snprintf(buf, len, "HEAT COOL");
            } else if (mode == "off") {
              snprintf(buf, len, "OFF");
            } else {
              size_t j = 0;
              for (size_t i = 0; i < mode.size() && j + 1 < len; i++) {
                const char c = mode[i];
                if (c == '_') {
                  if (j + 2 < len) buf[j++] = ' ';
                } else {
                  buf[j++] = (char) std::toupper((unsigned char) c);
                }
              }
              buf[j] = '\0';
            }
          };
          static auto format_fan_label = [&](const std::string &mode, char *buf, size_t len) {
            if (is_invalid(mode)) {
              snprintf(buf, len, "FAN ---");
              return;
            }
            char mode_buf[24];
            format_mode_label(mode, mode_buf, sizeof(mode_buf));
            snprintf(buf, len, "FAN %s", mode_buf);
          };

          const int cm = id(air_control_mode);
          const bool fan_supported = id(air_fan_modes_supported);

          int t = id(air_temp);
          static char tbuf[10];
          if (t % 2 == 0) {
            snprintf(tbuf, sizeof(tbuf), "%d", t / 2);
          } else {
            snprintf(tbuf, sizeof(tbuf), "%d.5", t / 2);
          }
          lv_label_set_text(id(lbl_air_temp), tbuf);

          float ct = id(ha_air_current_temp).state;
          float hm = id(ha_air_humidity).state;
          if (isnan(ct)) ct = (float)(t / 2);
          if (isnan(hm)) hm = 60.0f;

          static char sbuf[40];
          snprintf(sbuf, sizeof(sbuf), "Temp %.0f\xc2\xb0  Humid %.0f%%", ct, hm);
          lv_label_set_text(id(lbl_air_info), sbuf);

          lv_arc_set_value(id(air_set_arc), t);

          std::string hvac_mode;
          if (cm == 2 && !is_invalid(id(air_hvac_mode_pending))) {
            hvac_mode = id(air_hvac_mode_pending);
          } else if (id(ha_air_hvac_mode).has_state()) {
            hvac_mode = id(ha_air_hvac_mode).state;
          }
          if (is_invalid(hvac_mode)) hvac_mode = "off";

          static char hvac_buf[24];
          format_mode_label(hvac_mode, hvac_buf, sizeof(hvac_buf));
          const uint32_t hvac_col = hvac_color(hvac_mode);
          lv_label_set_text(id(lbl_air_mode), hvac_buf);
          lv_label_set_text(id(lbl_air_mode_hvac), hvac_buf);
          lv_obj_set_style_text_color(id(lbl_air_mode), lv_color_hex(hvac_col), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_air_mode_hvac), lv_color_hex(hvac_col), LV_PART_MAIN);

          std::string fan_mode;
          if (cm == 1 && !is_invalid(id(air_fan_mode_pending))) {
            fan_mode = id(air_fan_mode_pending);
          } else if (id(ha_air_fan_mode).has_state() && !is_invalid(id(ha_air_fan_mode).state)) {
            fan_mode = id(ha_air_fan_mode).state;
          }
          static char fan_buf[28];
          format_fan_label(fan_mode, fan_buf, sizeof(fan_buf));
          lv_label_set_text(id(lbl_air_fan), fan_buf);

          if (cm == 1) {
            lv_obj_add_flag(id(lbl_air_temp), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_temp_degree), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_info), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_mode), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_mode_hvac), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_fan), LV_OBJ_FLAG_HIDDEN);
          } else if (cm == 2) {
            lv_obj_clear_flag(id(lbl_air_temp), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_temp_degree), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_info), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_mode), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_mode_hvac), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_fan), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_opa(id(lbl_air_temp), LV_OPA_40, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_air_temp_degree), LV_OPA_40, LV_PART_MAIN);
          } else {
            lv_obj_clear_flag(id(lbl_air_temp), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_temp_degree), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_info), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_air_mode), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_mode_hvac), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_air_fan), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_opa(id(lbl_air_temp), LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_air_temp_degree), LV_OPA_COVER, LV_PART_MAIN);
          }

          const lv_opa_t arc_opa = (cm == 0) ? LV_OPA_COVER : LV_OPA_40;
          lv_obj_set_style_arc_opa(id(air_set_arc), arc_opa, LV_PART_INDICATOR);
          lv_obj_set_style_bg_opa(id(air_set_arc), arc_opa, LV_PART_KNOB);

          lv_img_set_src(id(img_air_fan_btn), cm == 1 ? id(img_air_fan_on) : id(img_air_fan_off));
          lv_img_set_src(id(img_air_power_btn), id(air_btn_power_active) ? id(img_air_power_on) : id(img_air_power_off));
          lv_img_set_src(id(img_air_swing_btn), cm == 2 ? id(img_air_swing_on) : id(img_air_swing_off));

          const lv_opa_t fan_btn_opa = fan_supported ? LV_OPA_COVER : LV_OPA_40;
          lv_obj_set_style_opa(id(btn_air_fan), fan_btn_opa, LV_PART_MAIN);
          lv_obj_set_style_opa(id(img_air_fan_btn), fan_btn_opa, LV_PART_MAIN);

          lv_obj_set_style_border_width(id(btn_air_fan), cm == 1 ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_fan), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          lv_obj_set_style_border_width(id(btn_air_power), id(air_btn_power_active) ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_power), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          lv_obj_set_style_border_width(id(btn_air_swing), cm == 2 ? 2 : 0, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_air_swing), lv_color_hex(0x00D7FF), LV_PART_MAIN);

          static auto split_csv = [](const std::string &csv, std::vector<std::string> &out) {
            out.clear();
            size_t start = 0;
            while (start <= csv.size()) {
              size_t pos = csv.find('|', start);
              if (pos == std::string::npos) pos = csv.size();
              if (pos > start) out.push_back(csv.substr(start, pos - start));
              if (pos == csv.size()) break;
              start = pos + 1;
            }
          };

          int fan_seg_count = 0;
          bool fan_seg_auto = false;
          if (fan_supported) {
            std::string fan_mode_seg;
            if (!is_invalid(id(air_fan_mode_pending))) {
              fan_mode_seg = id(air_fan_mode_pending);
            } else if (id(ha_air_fan_mode).has_state() && !is_invalid(id(ha_air_fan_mode).state)) {
              fan_mode_seg = id(ha_air_fan_mode).state;
            } else if (!is_invalid(id(air_last_valid_fan_mode))) {
              fan_mode_seg = id(air_last_valid_fan_mode);
            }
            if (!is_invalid(fan_mode_seg)) {
              if (fan_mode_seg == "auto") {
                fan_seg_count = 5;
                fan_seg_auto = true;
              } else {
                std::vector<std::string> fan_modes;
                split_csv(id(air_fan_modes_csv), fan_modes);
                std::vector<std::string> manual_modes;
                for (const auto &m : fan_modes) {
                  if (m != "auto") manual_modes.push_back(m);
                }
                if (!manual_modes.empty()) {
                  size_t idx = manual_modes.size();
                  for (size_t i = 0; i < manual_modes.size(); i++) {
                    if (manual_modes[i] == fan_mode_seg) {
                      idx = i;
                      break;
                    }
                  }
                  if (idx < manual_modes.size()) {
                    if (manual_modes.size() == 1) {
                      fan_seg_count = 5;
                    } else {
                      fan_seg_count = 1 + (int) ((idx * 4) / (manual_modes.size() - 1));
                    }
                  } else {
                    fan_seg_count = 1;
                  }
                } else {
                  fan_seg_count = 1;
                }
              }
            }
          }

          lv_obj_t *fan_segs[5] = {
            id(fan_seg_1), id(fan_seg_2), id(fan_seg_3), id(fan_seg_4), id(fan_seg_5)
          };
          for (int s = 0; s < 5; s++) {
            const bool on = fan_supported && fan_seg_count >= (s + 1);
            const lv_opa_t seg_opa = (cm == 1) ? LV_OPA_COVER : (lv_opa_t)(255 * 70 / 100);
            if (!on) {
              lv_obj_set_style_arc_color(fan_segs[s], lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
              lv_obj_set_style_arc_opa(fan_segs[s], LV_OPA_TRANSP, LV_PART_INDICATOR);
            } else if (fan_seg_auto) {
              lv_obj_set_style_arc_color(fan_segs[s], lv_color_hex(0x22C55E), LV_PART_INDICATOR);
              lv_obj_set_style_arc_opa(fan_segs[s], seg_opa, LV_PART_INDICATOR);
            } else {
              lv_obj_set_style_arc_color(fan_segs[s], lv_color_hex(0xFFFFFF), LV_PART_INDICATOR);
              lv_obj_set_style_arc_opa(fan_segs[s], seg_opa, LV_PART_INDICATOR);
            }
          }

