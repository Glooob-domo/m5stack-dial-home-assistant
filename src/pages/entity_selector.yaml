                  id: es_dot_1
                  align: RIGHT_MID
                  x: -10
                  y: -14
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: col_menu_sdot_dim
                  border_width: 0
                  clickable: false
              - obj:
                  id: es_dot_2
                  align: RIGHT_MID
                  x: -10
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: col_menu_accent
                  border_width: 0
                  clickable: false
              - obj:
                  id: es_dot_3
                  align: RIGHT_MID
                  x: -10
                  y: 14
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: col_menu_sdot_dim
                  border_width: 0
                  clickable: false
              - obj:
                  id: es_dot_4
                  align: RIGHT_MID
                  x: -10
                  y: 28
