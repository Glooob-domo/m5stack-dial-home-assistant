                              id: es_slot_far_up_img
                              align: LEFT_MID
                              x: 2
                              src: menu_img_ac
                    - obj:
                        id: es_slot_near_up
                        align: TOP_MID
                        y: 42
                        width: 180
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: true
                        on_click:
                          - lambda: 'id(entity_selector_touch_slot).execute(-1);'
                        widgets:
