                          - label:
                              id: es_slot_center_sub
                              x: 54
                              y: 30
                              width: 106
                              long_mode: DOT
                              text_font: font_menu_sub
                              text_color: col_menu_val
                              text: ""
                    - obj:
                        id: es_slot_near_dn
