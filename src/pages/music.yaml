---
substitutions:
  icon_play: "\uF000"
  icon_pause: "\uF001"
  icon_forward: "\uF002"
  icon_backward: "\uF003"
  icon_music: "\uF004"
  icon_volume: "\uF005" 

font:
  - file:
      family: DM+Sans
      weight: 300
      type: gfonts
    id: font_music_title
    size: 15
    bpp: 4
    glyphs: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?-''_()"&áéíóúÁÉÍÓÚñÑüÜçÇàèêëîïôùûÀÈÊ¿¡’'

  - file: ${asset_url}src/assets/fonts/media_player_icons.ttf
    id: media_player_icons
    size: 24
    bpp: 4
    glyphs:
    - ${icon_play}  # play-solid-full
    - ${icon_pause}  # pause-solid-full
    - ${icon_forward}  # forward-solid-full
    - ${icon_backward}  # backward-solid-full
    - ${icon_music}
    - ${icon_volume}

color:
  - id: col_music_bg
    hex: "000000"
  - id: col_music_ring_track
    hex: "000000"
  - id: col_music_ring_progress
    hex: "764CFF"
  - id: col_music_play_btn
    hex: "A98FFF"
  - id: col_music_dark
    hex: "1A1040"

sendspin:
  id: sendspin_hub

media_player:
  - platform: sendspin
    id: sendspin_media_player
    name: "M5Stack Dial"
    volume_increment: 10

generic_image:
  - platform: sendspin
    id: sendspin_cover_art
    format: jpg
    type: rgb565
    resize: 100x100
    image_source: ALBUM
    on_image_decoded:
      - logger.log: "Album image decoded"
      - lambda: |-
          if (!id(music_has_cover)) {
            id(music_has_cover) = true;
            id(music_apply_cover_mode).execute();
          }
      - lambda: |-
          lv_obj_t *obj = id(img_music_cover);
          static lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_time(&a, 200);
          lv_anim_set_exec_cb(&a, [](void *var, int32_t v) {
            lv_obj_set_style_opa((lv_obj_t *)var, v, 0);
          });
          lv_anim_start(&a);
      - delay: 200ms    
      - lvgl.image.update:
          id: img_music_cover
          src: sendspin_cover_art
      - lambda: |-
          lv_obj_t *obj = id(img_music_cover);
          static lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, obj);
          lv_anim_set_values(&a, LV_OPA_TRANSP, LV_OPA_COVER);
          lv_anim_set_time(&a, 300);
          lv_anim_set_exec_cb(&a, [](void *var, int32_t v) {
            lv_obj_set_style_opa((lv_obj_t *)var, v, 0);
          });
          lv_anim_start(&a);

text_sensor:
  - platform: sendspin
    id: track_title
    type: title
    on_value:
      - script.execute: refresh_music_metadata
      - script.execute: menu_on_ha_update

  - platform: sendspin
    id: track_artist
    type: artist
    on_value:
      - script.execute: refresh_music_metadata

  - platform: sendspin
    id: sendspin_playback_state
    type: playback_state
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGD("music", "SendSpin playback state: %s", x.c_str());
          bool playing = (x == "playing");
          id(music_playing) = playing;
          lv_label_set_text(id(play_label), playing ? "${icon_pause}" : "${icon_play}");
          auto duration = id(sendspin_hub).get_track_duration_ms();
          if (duration > 0) {
            id(local_duration_ms) = duration;
            id(local_progress_ms) = id(sendspin_hub).get_track_progress_ms();
            id(local_progress_sync_ms) = millis();
          }
      - script.execute: refresh_music_progress
      - script.execute: menu_on_ha_update

sensor:
  - platform: sendspin
    id: sendspin_controller_volume
    type: controller_volume
    internal: true
    on_value:
      - lambda: |-
          if (x != x) return;
          if ((int32_t)(id(music_volume_override_until_ms) - millis()) > 0) return;
          int v = (int)(x + 0.5f);
          if (v < 0) v = 0;
          if (v > 100) v = 100;
          id(music_volume) = v;
      - script.execute: refresh_music_volume

globals:
  - id: in_music
    type: bool
    initial_value: 'false'
  - id: music_volume
    type: int
    initial_value: '36'
  - id: music_playing
    type: bool
    initial_value: 'false'
  - id: music_progress
    type: int
    initial_value: '0'
  - id: local_progress_ms
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_duration_ms
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_progress_sync_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_spin_progress_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_spin_progress_seen_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: music_state_override_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: music_volume_override_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: music_feedback_btn
    type: int
    initial_value: '0'
  # Set once a real SendSpin cover has ever been decoded. Starts false so
  # most users (no SendSpin) get the bigger no-cover layout by default,
  # instead of empty space reserved for artwork that will never arrive.
  - id: music_has_cover
    type: bool
    initial_value: 'false'

script:
  - id: open_music
    then:
      - globals.set: {id: in_music, value: 'true'}
      - globals.set: {id: in_menu, value: 'false'}
      - globals.set: {id: in_entity_selector, value: 'false'}
      - lambda: |-
          if (id(dial_media_players_id).count() == 0) return;
          if (id(dial_media_players_id).active_attr_valid("volume")) {
            int v = (int)(atof(id(dial_media_players_id).active_attr("volume").c_str()) * 100.0f + 0.5f);
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            id(music_volume) = v;
          }
      - script.execute: music_apply_cover_mode
      - script.execute: refresh_music_volume
      - script.execute: refresh_music_metadata
      - lvgl.page.show:
          id: page_music
          animation: MOVE_LEFT

  - id: close_music
    then:
      - globals.set: {id: in_music, value: 'false'}
      - if:
          condition:
            lambda: 'return id(dial_media_players_id).count() > 1;'
          then:
            - globals.set: {id: entity_selector_kind, value: '1'}
            - script.execute: open_entity_selector_back
          else:
            - script.execute: open_menu_back

  - id: refresh_music_metadata
    then:
      - lambda: |-
          std::string title;
          std::string artist;
          bool title_attr_valid = id(dial_media_players_id).active_attr_valid("title");
          if (title_attr_valid)
            title = id(dial_media_players_id).active_attr("title");
          if (id(dial_media_players_id).active_attr_valid("artist"))
            artist = id(dial_media_players_id).active_attr("artist");
          if (title.empty()) title = id(track_title).state;
          if (title.empty()) title = dial_i18n::ready_to_play();
          static std::string last_logged_title;
          if (title != last_logged_title) {
            ESP_LOGI("music", "METADATA title_attr_valid=%d title='%s' artist='%s'",
                     title_attr_valid, title.c_str(), artist.c_str());
            last_logged_title = title;
          }
          lv_label_set_text(id(lbl_music_title), title.c_str());
          if (artist.empty()) artist = id(track_artist).state;
          lv_label_set_text(id(lbl_music_artist), artist.c_str());

  - id: music_transport_feedback
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *btn = nullptr;
          switch (id(music_feedback_btn)) {
            case 0: btn = id(prev_btn); break;
            case 1: btn = id(play_btn); break;
            default: btn = id(next_btn); break;
          }
          if (btn == nullptr) return;
          if (id(music_feedback_btn) == 1) {
            lv_obj_set_style_bg_opa(btn, LV_OPA_50, 0);
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, btn);
            lv_anim_set_values(&a, LV_OPA_50, LV_OPA_COVER);
            lv_anim_set_time(&a, 180);
            lv_anim_set_exec_cb(&a, [](void *var, int32_t v) {
              lv_obj_set_style_bg_opa((lv_obj_t *)var, v, 0);
            });
            lv_anim_start(&a);
          } else {
            lv_obj_set_style_opa(btn, 120, 0);
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, btn);
            lv_anim_set_values(&a, 120, 255);
            lv_anim_set_time(&a, 180);
            lv_anim_set_exec_cb(&a, [](void *var, int32_t v) {
              lv_obj_set_style_opa((lv_obj_t *)var, v, 0);
            });
            lv_anim_start(&a);
          }
      - rtttl.play: "b:d=16,o=6,b=200:c"

  - id: play_next
    then:
      - if:
          condition:
            lambda: 'return id(in_music) && id(dial_media_players_id).count() > 0;'
          then:
            - lambda: 'id(music_feedback_btn) = 2;'
            - script.execute:
                id: music_transport_feedback
                wait_for_finish: false
            - lambda: |-
                ESP_LOGI("music", "MUSIC_HA_ACTION next entity=%s",
                         id(dial_media_players_id).active_entity_id().c_str());
            - homeassistant.action:
                action: media_player.media_next_track
                data:
                  entity_id: !lambda 'return id(dial_media_players_id).active_entity_id();'

  - id: play_prev
    then:
      - if:
          condition:
            lambda: 'return id(in_music) && id(dial_media_players_id).count() > 0;'
          then:
            - lambda: 'id(music_feedback_btn) = 0;'
            - script.execute:
                id: music_transport_feedback
                wait_for_finish: false
            - lambda: |-
                ESP_LOGI("music", "MUSIC_HA_ACTION previous entity=%s",
                         id(dial_media_players_id).active_entity_id().c_str());
            - homeassistant.action:
                action: media_player.media_previous_track
                data:
                  entity_id: !lambda 'return id(dial_media_players_id).active_entity_id();'

  - id: play_toggle
    then:
      - if:
          condition:
            lambda: 'return id(in_music) && id(dial_media_players_id).count() > 0;'
          then:
            - lambda: 'id(music_feedback_btn) = 1;'
            - script.execute:
                id: music_transport_feedback
                wait_for_finish: false
            - lambda: |-
                bool current_playing = id(sendspin_playback_state).state == "playing";
                if (id(dial_media_players_id).active_state_valid()) {
                  const std::string &st = id(dial_media_players_id).active_state();
                  current_playing = current_playing || st == "playing" || st == "buffering";
                }
                bool will_play = !current_playing;
                id(music_playing) = will_play;
                id(music_state_override_until_ms) = millis() + 2500;
                if (will_play && id(local_progress_sync_ms) == 0) {
                  id(local_progress_sync_ms) = millis();
                }
                lv_label_set_text(id(play_label), will_play ? "${icon_pause}" : "${icon_play}");
            - lambda: |-
                ESP_LOGI("music", "MUSIC_HA_ACTION play_pause entity=%s",
                         id(dial_media_players_id).active_entity_id().c_str());
            - homeassistant.action:
                action: media_player.media_play_pause
                data:
                  entity_id: !lambda 'return id(dial_media_players_id).active_entity_id();'

  - id: music_volume_up
    then:
      - lambda: |-
          int v = id(music_volume) + ${music_volume_step};
          if (v > 100) v = 100;
          id(music_volume) = v;
          id(music_volume_override_until_ms) = millis() + 1200;
      - lambda: |-
          ESP_LOGI(
            "music",
            "MUSIC_HA_ACTION volume_set entity=%s volume=%.2f",
            id(dial_media_players_id).active_entity_id().c_str(),
            id(music_volume) / 100.0f
          );
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda 'return id(dial_media_players_id).active_entity_id();'
          data_template:
            volume_level: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.2f", id(music_volume) / 100.0f);
              return std::string(buf);
      - script.execute: refresh_music_volume     

  - id: music_volume_down
    then:
      - lambda: |-
          int v = id(music_volume) - ${music_volume_step};
          if (v < 0) v = 0;
          id(music_volume) = v;
          id(music_volume_override_until_ms) = millis() + 1200;
      - lambda: |-
          ESP_LOGI(
            "music",
            "MUSIC_HA_ACTION volume_set entity=%s volume=%.2f",
            id(dial_media_players_id).active_entity_id().c_str(),
            id(music_volume) / 100.0f
          );
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda 'return id(dial_media_players_id).active_entity_id();'
          data_template:
            volume_level: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.2f", id(music_volume) / 100.0f);
              return std::string(buf);
      - script.execute: refresh_music_volume

  - id: refresh_music_volume
    then:
      - lambda: |-
          int v = id(music_volume);
          auto off = lv_color_hex(0x000000);
          lv_obj_set_style_bg_color(id(vol_bar_1), v >  0 ? lv_color_hex(0xA98FFF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_2), v > 14 ? lv_color_hex(0xA387FF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_3), v > 28 ? lv_color_hex(0x9D7FFF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_4), v > 42 ? lv_color_hex(0x9170FF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_5), v > 57 ? lv_color_hex(0x8661FF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_6), v > 71 ? lv_color_hex(0x7E57FF) : off, 0);
          lv_obj_set_style_bg_color(id(vol_bar_7), v > 85 ? lv_color_hex(0x764CFF) : off, 0);
          lv_arc_set_value(id(arc_music_volume), v);
          char buf[4];
          snprintf(buf, sizeof(buf), "%d", v);
          lv_label_set_text(id(lbl_music_volume_num), buf);
          ESP_LOGI("music", "volume=%d", v);

  - id: music_apply_cover_mode
    then:
      - lambda: |-
          const bool cover = id(music_has_cover);
          if (cover) {
            lv_obj_clear_flag(id(music_cover_wrap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(music_vol_bars_wrap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(arc_music_volume), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_music_volume_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_music_volume_pct), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_size(id(prev_btn), 44, 44);
            lv_obj_set_pos(id(prev_btn), 52, 185);
            lv_obj_set_size(id(play_btn), 44, 44);
            lv_obj_set_pos(id(play_btn), 102, 186);
            lv_obj_set_size(id(next_btn), 44, 44);
            lv_obj_set_pos(id(next_btn), 151, 185);
          } else {
            lv_obj_add_flag(id(music_cover_wrap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(music_vol_bars_wrap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(arc_music_volume), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_music_volume_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_music_volume_pct), LV_OBJ_FLAG_HIDDEN);
            // Bigger, more accessible transport buttons when the space
            // that would hold cover art is free.
            lv_obj_set_size(id(prev_btn), 50, 50);
            lv_obj_set_pos(id(prev_btn), 45, 182);
            lv_obj_set_size(id(play_btn), 52, 52);
            lv_obj_set_pos(id(play_btn), 94, 180);
            lv_obj_set_size(id(next_btn), 50, 50);
            lv_obj_set_pos(id(next_btn), 151, 182);
          }

  - id: refresh_music_progress
    then:
      - lambda: |-
          int dur = id(local_duration_ms);
          int pos = id(local_progress_ms);
          if (dur <= 0) {
            id(music_progress) = 0;
          } else {
            if (pos < 0) pos = 0;
            if (pos > dur) pos = dur;
            id(music_progress) = (int)((float) pos / (float) dur * 100.0f + 0.5f);
            if (id(music_progress) > 100) id(music_progress) = 100;
          }
          lv_arc_set_value(id(arc_music_progress), id(music_progress));
          ESP_LOGD("music", "progress=%d", id(music_progress));

lvgl:
  pages:
    - id: page_music
      bg_color: col_music_bg
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            lv_obj_clear_flag(lv_scr_act(), LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_clear_flag(id(page_music_root), LV_OBJ_FLAG_SCROLLABLE);
      widgets:
        - obj:
            id: page_music_root
            align: TOP_LEFT
            x: 0
            y: 0
            width: 240
            height: 240
            radius: 120
            clip_corner: true
            bg_color: col_music_bg
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - arc:
                  id: arc_music_progress
                  align: CENTER
                  width: 232
                  height: 232
                  rotation: 270
                  start_angle: 0
                  end_angle: 360
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_color: col_music_ring_track
                  arc_width: 5
                  arc_opa: COVER
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_color: col_music_ring_progress
                    arc_width: 5
                    arc_opa: COVER
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                    width: 0
                    height: 0

              - obj:
                  id: music_cover_wrap
                  x: 65
                  y: 2
                  width: 110
                  height: 110
                  radius: 55
                  bg_opa: TRANSP
                  border_width: 0
                  clip_corner: true
                  clickable: false
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    - image:
                        id: img_music_cover
                        src: logo_img
                        align: CENTER

              - arc:
                  id: arc_music_volume
                  x: 65
                  y: 2
                  width: 110
                  height: 110
                  rotation: 90
                  start_angle: 55
                  end_angle: 305
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_color: col_music_dark
                  arc_width: 8
                  arc_opa: COVER
                  arc_rounded: true
                  adjustable: false
                  clickable: false
                  indicator:
                    arc_color: col_music_ring_progress
                    arc_width: 8
                    arc_opa: COVER
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                    width: 0
                    height: 0
              - label:
                  id: lbl_music_volume_num
                  x: 65
                  y: 24
                  width: 110
                  text_align: CENTER
                  text_font: font_light_big
                  text_color: 0xFFFFFF
                  text: "0"
              - label:
                  id: lbl_music_volume_pct
                  x: 65
                  y: 76
                  width: 110
                  text_align: CENTER
                  text_font: font_light_pct
                  text_color: col_music_ring_progress
                  text: "%"
              - label:
                  id: lbl_music_title
                  x: 20
                  y: 118
                  width: 200
                  text: !lambda "return std::string(dial_i18n::ready_to_play());"
                  text_font: font_music_title
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  on_boot:
                    - lambda: |-
                        lv_obj_set_style_anim_time(id(lbl_music_title), 15000, 0);
                        lv_label_set_long_mode(id(lbl_music_title), LV_LABEL_LONG_SCROLL);
                        lv_label_set_recolor(id(lbl_music_title), true);
              - label:
                  id: lbl_music_artist
                  x: 20
                  y: 139
                  width: 200
                  text: ""
                  text_font: font_music_title
                  text_color: 0xAAAAAA
                  text_align: CENTER
                  on_boot:
                    - lambda: |-
                        lv_obj_set_style_anim_time(id(lbl_music_artist), 15000, 0);
                        lv_label_set_long_mode(id(lbl_music_artist), LV_LABEL_LONG_SCROLL);
              - obj:
                  id: music_vol_bars_wrap
                  x: 0
                  y: 0
                  width: 240
                  height: 178
                  bg_opa: TRANSP
                  border_width: 0
                  clickable: false
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    - label:
                        text_font: media_player_icons
                        text: ${icon_volume}
                        x: 70
                        y: 160
                        text_color: 0xFFFFFF

                    - obj: {id: vol_bar_1, x: 97,  y: 165, width: 6, height: 12, radius: 3, bg_color: 0xA98FFF, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_2, x: 107, y: 165, width: 6, height: 12, radius: 3, bg_color: 0xA387FF, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_3, x: 117, y: 165, width: 6, height: 12, radius: 3, bg_color: 0x000000, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_4, x: 127, y: 165, width: 6, height: 12, radius: 3, bg_color: 0x000000, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_5, x: 137, y: 165, width: 6, height: 12, radius: 3, bg_color: 0x000000, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_6, x: 147, y: 165, width: 6, height: 12, radius: 3, bg_color: 0x000000, bg_opa: COVER, border_width: 0, clickable: false}
                    - obj: {id: vol_bar_7, x: 157, y: 165, width: 6, height: 12, radius: 3, bg_color: 0x000000, bg_opa: COVER, border_width: 0, clickable: false}

              - button:
                  x: 52
                  y: 185
                  width: 44
                  height: 44
                  bg_color: col_music_dark
                  bg_opa: TRANSP
                  shadow_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "OFF"
                  id: prev_btn
                  on_press:
                    - script.execute: play_prev
                  on_boot:
