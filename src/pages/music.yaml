interval:
  - interval: 200ms
    then:
      - lambda: |-
          uint32_t now_ms = millis();
          bool server_playing = id(sendspin_playback_state).state == "playing";
          bool have_players = id(dial_media_players_id).count() > 0;
          if (have_players && id(dial_media_players_id).active_state_valid()) {
            const std::string &st = id(dial_media_players_id).active_state();
            server_playing = server_playing || st == "playing" || st == "buffering";
            if (id(in_music) && (int32_t)(id(music_volume_override_until_ms) - now_ms) <= 0 &&
                id(dial_media_players_id).active_attr_valid("volume")) {
              int v = (int)(atof(id(dial_media_players_id).active_attr("volume").c_str()) * 100.0f + 0.5f);
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              if (v != id(music_volume)) {
                id(music_volume) = v;
                id(refresh_music_volume).execute();
              }
            }
            if (id(in_music)) {
              if (id(dial_media_players_id).active_attr_valid("duration")) {
                const float d = atof(id(dial_media_players_id).active_attr("duration").c_str());
                if (d > 0) id(local_duration_ms) = (int)(d * 1000.0f + 0.5f);
              }
              if ((int32_t)(id(music_state_override_until_ms) - now_ms) <= 0 &&
                  id(dial_media_players_id).active_attr_valid("position")) {
                const float p = atof(id(dial_media_players_id).active_attr("position").c_str());
                if (p >= 0) {
                  id(local_progress_ms) = (int)(p * 1000.0f + 0.5f);
                  id(local_progress_sync_ms) = now_ms;
                }
              }
            }
          }
          // Title/artist/cover only depend on their own attribute sensors,
          // not on the media player's overall "state" sensor — keep them
          // refreshing even if state briefly lags or reports invalid, so a
          // flaky state sync doesn't also blank out what's playing.
          if (id(in_music) && have_players) {
            id(refresh_music_metadata).execute();
          }
          bool use_local_state = (int32_t)(id(music_state_override_until_ms) - now_ms) > 0;
          bool playing = use_local_state ? id(music_playing) : server_playing;
          id(music_playing) = playing;
          lv_label_set_text(id(play_label), playing ? "${icon_pause}" : "${icon_play}");

          uint32_t spin_pos = id(sendspin_hub).get_track_progress_ms();
          auto spin_dur = id(sendspin_hub).get_track_duration_ms();
          if (spin_dur > 0) {
            id(local_duration_ms) = spin_dur;
            if (spin_pos != id(last_spin_progress_ms)) {
              id(local_progress_ms) = spin_pos;
              id(local_progress_sync_ms) = now_ms;
              id(last_spin_progress_ms) = spin_pos;
              id(last_spin_progress_seen_ms) = now_ms;
            } else if (id(last_spin_progress_seen_ms) == 0) {
              id(last_spin_progress_seen_ms) = now_ms;
            }
          }

          int dur = id(local_duration_ms);
          if (dur <= 0) {
            id(music_progress) = 0;
            lv_arc_set_value(id(arc_music_progress), 0);
            id(local_progress_sync_ms) = now_ms;
            return;
          }

          bool spin_progress_stale = spin_dur > 0 && (now_ms - id(last_spin_progress_seen_ms)) > 800;
          if (playing && (spin_dur <= 0 || spin_progress_stale)) {
            uint32_t elapsed_ms = id(local_progress_sync_ms) == 0 ? 200 : now_ms - id(local_progress_sync_ms);
            if (elapsed_ms > 1000) elapsed_ms = 1000;
            id(local_progress_ms) += elapsed_ms;
            id(local_progress_sync_ms) = now_ms;
          } else if (!playing) {
            id(local_progress_sync_ms) = now_ms;
          }

          if (id(local_progress_ms) > dur) id(local_progress_ms) = dur;
          if (id(local_progress_ms) < 0) id(local_progress_ms) = 0;
          float progress = (float)id(local_progress_ms) / dur * 100.0f;
          if (progress > 100) progress = 100;
          id(music_progress) = (int)(progress + 0.5f);
          lv_arc_set_value(id(arc_music_progress), id(music_progress));
