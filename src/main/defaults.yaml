# Fallbacks if a key is missing from m5-dial.yaml. Hidden on the Dial.
substitutions:
  timezone: Europe/Paris
  weather_entity: weather.disabled
  aqi_entity: sensor.disabled
  # Prefix for fonts/images. GitHub raw URL when this file is used as a
  # remote package (ESPHome looks up file: paths in /config/esphome/).
  # Override with "" in m5-dial.local.yaml to use files from this clone.
  asset_url: "https://raw.githubusercontent.com/Glooob-domo/m5stack-dial-home-assistant/main/"
  # Clock, menu and page labels. en, fr, es, de, it
  ui_language: en
  # Quadrature pulses counted per encoder click. 1, 2 or 4.
  encoder_resolution: "1"
  # Amount one encoder step changes on pages that edit an entity value.
  cover_position_step: "5"      # % per step, 1-100
  light_brightness_step: "1"    # % per step, 1-100
  climate_temperature_step: "2" # 0.5C units per step: 2 = 1C, 1 = 0.5C
  music_volume_step: "10"       # % per step, 1-100

# Empty lists hide those pages until m5-dial.yaml lists entities.
dial_lights: []
dial_climates: []
dial_media_players: []
dial_covers: []
dial_garages: []
dial_switches: []
dial_scenes: []
dial_temperatures: []
