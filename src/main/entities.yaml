substitutions:
  # Fallbacks if a key is missing from m5-dial.yaml. Hidden on the Dial.
  timezone: Europe/Paris
  weather_entity: weather.disabled
  aqi_entity: sensor.disabled
  # Prefix for fonts/images. GitHub raw URL when this file is used as a
  # remote package (ESPHome looks up file: paths in /config/esphome/).
  # Override with "" in m5-dial.local.yaml to use files from this clone.
  asset_url: "https://raw.githubusercontent.com/Glooob-domo/m5stack-dial-home-assistant/main/"

