packages:
  defaults:    !include src/main/defaults.yaml
  hardware:    !include src/main/hardware.yaml
  load_page:   !include src/pages/load.yaml
  clock_page:  !include src/pages/main.yaml
  menu_page:   !include src/pages/menu.yaml
  light_page:  !include src/pages/light.yaml
  light_selector_page: !include src/pages/light_selector.yaml
  entity_selector_page: !include src/pages/entity_selector.yaml
  air_page:    !include src/pages/air.yaml
  music_page:  !include src/pages/music.yaml
  cover_page:  !include src/pages/cover.yaml
  switch_page: !include src/pages/switch.yaml
  scene_page:  !include src/pages/scene.yaml
  temp_page:   !include src/pages/temp.yaml
  alarm_page:  !include src/pages/alarm.yaml
  idle:        !include src/main/idle.yaml

external_components:
  # GitHub, not type: local — ESPHome resolves local paths against the
  # user's /config/esphome folder, not this package.
  - source: github://Glooob-domo/m5stack-dial-home-assistant@main
    components: [dial_lights, dial_ha_list, dial_climates, dial_media_players, dial_covers, dial_garages, dial_switches, dial_scenes, dial_temperatures, dial_carousel, dial_i18n, generic_image, media_source, sendspin]
    refresh: 0s

substitutions:
  # Remote packages cannot resolve !secret themselves. Set these from the
  # consumer configuration (usually with !secret values in that local file).
  device_name: m5stack-dialv1
  device_friendly_name: M5Stack Dial
  wifi_ssid: YOUR_WIFI_SSID
  wifi_password: YOUR_WIFI_PASSWORD
  ap_ssid: Dial Fallback Hotspot
  ap_password: change-me-fallback-password
  # Public dummy key for validation only. Always override before flashing.
  api_encryption_key: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  ota_password: change-me-ota-password
  screen_dim_timeout: 45s
  screen_return_timeout: 5min
  screen_off_timeout: 30min
  screen_dim_brightness: "20%"
  encoder_resolution: "1"
  # Amount one encoder step changes on pages that edit an entity value.
  cover_position_step: "5"      # % per step, 1-100
  light_brightness_step: "1"    # % per step, 1-100
  climate_temperature_step: "2" # 0.5C units per step: 2 = 1C, 1 = 0.5C
  music_volume_step: "10"       # % per step, 1-100

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  min_version: 2026.7.0
  # interval: (PollingComponent/scheduler) never fired on this device -
  # confirmed by diagnostic logging on every page that used it, while
  # on_loop (runs every main-loop iteration, no scheduler involved) fired
  # reliably. Every periodic tick in this project now runs from on_loop
  # blocks (one per page, each with its own millis() throttle) instead of
  # interval:, merged here from src/main/idle.yaml and src/pages/*.yaml.
  on_boot:
    - priority: 800
      then:
        - switch.turn_on: power_hold
    - priority: -100
      then:
        - pcf8563.read_time:
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - script.execute: update_loading_page
        - lambda: |-
            // Every page drives the encoder itself via on_clockwise/
            // on_anticlockwise; LVGL's own group-focus navigation is never
            // wanted. Detach it globally instead of excluding widgets one
            // by one (see Music's prev/play/next buttons, which stayed
            // focusable and both visibly grabbed selection on rotation and
            // ate the front-button ENTER press meant for on_multi_click).
            lv_indev_set_group(id(lvgl_rotary_indev).get_drv(), nullptr);

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BROWNOUT_DET: "n"

logger:
  level: INFO

api:
  encryption:
    key: ${api_encryption_key}
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

dial_i18n:
  language: ${ui_language}

globals:
  - id: ha_connected
    type: bool
    initial_value: 'false'

image:
  - platform: file
    file: ${asset_url}src/assets/images/logo.png
    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - id: lvgl_rotary_indev
      sensor: encoder
      # Dummy: the physical button is handled in GPIO on_multi_click.
      # Binding front_button here also sends LVGL ENTER to hidden widgets
      # (e.g. music play), which beeps and steals the press.
      enter_button: lvgl_encoder_enter
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
