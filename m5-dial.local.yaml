# Compile ce dossier sans GitHub. Les utilisateurs n'ont besoin que de m5-dial.yaml.

substitutions:
  device_name: m5stack-dial
  device_friendly_name: M5Stack Dial
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  ap_ssid: Dial Fallback Hotspot
  ap_password: "changeme-dial-ap"

  timezone: Europe/Paris
  weather_entity: weather.disabled
  aqi_entity: sensor.disabled
  climate_entity: climate.disabled
  music_player_entity: media_player.disabled
  timer_entity: timer.disabled

  # Local files from this clone (empty prefix).
  asset_url: ""

dial_lights: []

# Local components while iterating; m5-dial.yaml (GitHub package) uses github:// instead.
external_components:
  - source:
      type: local
      path: components
    components: [dial_lights, dial_carousel, generic_image, media_source, sendspin]

packages:
  firmware: !include dial.yaml
