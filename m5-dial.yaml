# Fichier unique à coller dans ESPHome (dashboard).
# ESPHome télécharge le firmware depuis GitHub. Wi-Fi / clé API / OTA : secrets.yaml.
#
# Une liste vide (ou timer/weather en *.disabled) = pas de page sur le M5.
# Identifiants : Home Assistant → Outils de développement → États.

substitutions:
  device_name: m5stack-dial
  device_friendly_name: M5Stack Dial
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  ap_ssid: Dial Fallback Hotspot
  ap_password: "changeme-dial-ap"

  timezone: Europe/Paris

  # Interface : en, fr, es, de, it
  ui_language: fr

  # Molette : 1 = un pas par cran, 4 = plus sensible (sauts possibles en tournant lentement)
  encoder_resolution: "1"

  # --- Horloge (la page existe toujours) ---
  weather_entity: weather.disabled
  aqi_entity: sensor.disabled

  # --- Timer ---
  timer_entity: timer.disabled

# Une seule entrée = ouverture directe. Plusieurs = sélecteur.

# --- Lumière / Light ---
# dial_lights:
#   - entity_id: light.salon
#     name: Salon
dial_lights: []

# --- Chauffage / Climate ---
# dial_climates:
#   - entity_id: climate.salon
#     name: Salon
dial_climates: []

# --- Media Player ---
# dial_media_players:
#   - entity_id: media_player.salon
#     name: Salon
dial_media_players: []

# --- Ouverture / Cover ---
# dial_covers:
#   - entity_id: cover.volet_salon
#     name: Salon
dial_covers: []

# --- Garage ---
# dial_garages:
#   - entity_id: cover.portail
#     name: Portail
dial_garages: []

# --- Interrupteur / Switch ---
# dial_switches:
#   - entity_id: switch.prise_salon
#     name: Salon
dial_switches: []

# --- Scène / Scene ---
# dial_scenes:
#   - entity_id: scene.cinema
#     name: Cinema
#   - entity_id: script.tout_eteindre
#     name: Tout off
dial_scenes: []

packages:
  m5_dial:
    url: https://github.com/Glooob-domo/m5stack-dial-home-assistant
    ref: main
    files:
      - dial.yaml
    refresh: 0s
