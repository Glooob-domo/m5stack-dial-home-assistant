# Fichier unique à coller dans ESPHome (dashboard).
# ESPHome télécharge le firmware depuis GitHub. Wi-Fi / clé API / OTA : secrets.yaml.
#
# Une catégorie en *.disabled (ou dial_lights vide) = pas de page sur le M5.
# Identifiants : Home Assistant → Outils de développement → États.

substitutions:
  device_name: m5stack-dial
  device_friendly_name: M5Stack Dial
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  ap_ssid: Dial Fallback Hotspot
  ap_password: "changeme-dial-ap"

  timezone: Europe/Paris

  # --- Horloge (la page existe toujours) ---
  weather_entity: weather.disabled
  aqi_entity: sensor.disabled

  # --- Clim ---
  # Exemple : climate.salon
  climate_entity: climate.disabled

  # --- Musique ---
  # Exemple : media_player.salon
  music_player_entity: media_player.disabled

  # --- Timer ---
  # Exemple : timer.dial
  timer_entity: timer.disabled

# --- Lumières ---
# dial_lights:
#   - entity_id: light.salon
#     name: Salon
dial_lights: []

packages:
  m5_dial:
    url: https://github.com/Glooob-domo/m5stack-dial-home-assistant
    ref: main
    files:
      - dial.yaml
    refresh: 0s
